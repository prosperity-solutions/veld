name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Paired with the draft guard on `plan` — see the note above `jobs:` in
    # ci.yml. Without `ready_for_review` the version preview would never appear
    # on a PR that started life as a draft, which is every PR this repo opens.
    types: [opened, synchronize, reopened, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Only a PR's runs are cancellable. A push to main is a release: it tags,
# publishes artifacts and pushes a container image, and cancelling that midway
# leaves a tag with no artifacts behind it.
#
# Hence `github.sha`, not `github.ref`, as the non-PR key. A shared main group
# would let a newer merge cancel an older *pending* release run — which
# `cancel-in-progress: false` does not prevent, because that flag governs only
# in-progress runs. Per-SHA groups keep main releases independent, as they were
# before this block existed. See the fuller note in ci.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ── Plan: semantic-release dry run to show next version ──────────────
  # Runs on both push and PR. On PR, checks out the merge ref and
  # pretends it's main so semantic-release computes the real version.
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    # The only job here a PR can reach — every other one is `github.event_name ==
    # 'push'`. Draft PRs skip it: the next-version preview is worth a runner
    # minute once the PR is real, not on every intermediate agent commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: write
      issues: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      # On PR, the checkout is a detached merge ref — semantic-release
      # needs to see branch "main" to match .releaserc.json config.
      - name: Point local main at merge commit
        if: github.event_name == 'pull_request'
        run: git checkout -B main

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4
        id: semantic
        with:
          dry_run: true
          # conventional-changelog-conventionalcommits is pinned to v9:
          # @semantic-release/release-notes-generator@14 bundles
          # conventional-changelog-writer@8, and the conventionalcommits preset
          # v10+ emits writerOpts incompatible with it — the release notes body
          # comes out empty (header only). v9 matches the bundled writer. The
          # empty-notes regression started with #128, which added this preset.
          # NOTE: keep this list free of "#" comments — the action runs
          # `npm install` on every non-empty line verbatim.
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build ALL artifacts BEFORE tagging ─────────────────────────────
  build:
    name: Build (${{ matrix.suffix }})
    permissions:
      contents: read
    needs: plan
    # The Apple Developer ID certificate and its password live in this
    # environment, not as repository secrets, and the environment only deploys
    # from `main` — so even a workflow edit that dropped the push-only `if:`
    # below could not hand them to a branch. `docs/macos-signing.md` and
    # `scripts/release/apple-signing-setup.sh` create it.
    environment: release
    if: >-
      github.event_name == 'push'
      && needs.plan.outputs.new_release_published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            goos: darwin
            goarch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            goos: darwin
            goarch: amd64
          # Pinned to 24.04 (not ubuntu-latest) so the release binaries' glibc
          # matches the gateway image's ubuntu:24.04 base — when GitHub promotes
          # ubuntu-latest to a newer release the binaries would link a glibc the
          # base image lacks, breaking the container at startup.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            suffix: linux-amd64
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            suffix: linux-arm64
            cross: true
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/veld-daemon/ui/package-lock.json
      # First, before twenty minutes of compiling: a missing, mistyped or
      # nearly-expired certificate should fail the release here, not after the
      # build. **Fail closed, deliberately** — there is no ad-hoc fallback. One
      # ad-hoc release after a Developer ID one would flip every install's code
      # identity away and back again, re-prompting every user for every grant
      # twice; a red release is the cheaper outcome by far.
      #
      # Check only: the keychain is deleted again at once. `npm ci`, every
      # crate's build script and proc-macros, and the Caddy fetch all run below; this
      # keeps the identity out of reach while they run, so none of them can
      # simply call codesign as the team. "Developer ID-sign the macOS
      # binaries" imports it again after the last build and deletes it in the
      # same step. That narrows exposure, it is not isolation: code that ran
      # earlier in this job can still tamper with the checkout, PATH or
      # GITHUB_ENV that the signing step uses (as it already could with the
      # org signing key in "Package client binaries"). Moving signing to its
      # own job on a fresh runner is the real fix, and a recorded follow-up.
      - name: Check the Developer ID certificate
        if: matrix.goos == 'darwin'
        run: |
          kc="$RUNNER_TEMP/devid.keychain-db"
          scripts/release/macos-keychain.sh import "$kc" >/dev/null
          scripts/release/macos-keychain.sh delete "$kc"
        env:
          APPLE_DEVID_P12: ${{ secrets.APPLE_DEVID_P12 }}
          APPLE_DEVID_P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Install frontend dependencies
        run: cd crates/veld-daemon/ui && npm ci

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Set release version in Cargo.toml
        run: |
          VERSION="${{ needs.plan.outputs.new_release_version }}"
          sed -i'' -e "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      # Stock Caddy, unchanged from its upstream release, checked against the
      # SHA-512 pinned in scripts/release/caddy.sha512.
      - name: Fetch stock Caddy
        run: scripts/release/fetch-caddy.sh ${{ matrix.goos }} ${{ matrix.goarch }} dist/caddy

      # Every macOS binary the release ships, signed in place: the packaging
      # steps below copy them, and the signature travels inside the Mach-O.
      # The keychain exists only for the length of this step — nothing but
      # Apple's codesign runs while it is unlocked (see "Check the Developer ID
      # certificate" for why).
      #
      # Each binary MUST be Developer ID signed before `veld-sign` makes the
      # helper's `.sig` (in "Package client binaries"), so the helper arrives
      # with a code signature that verifies and install.sh leaves its bytes
      # alone — install.sh re-signs only a binary whose signature does NOT
      # verify, because a re-sign is not byte-identical across macOS releases
      # (macOS 27's codesign truncates this one) and would break the `.sig`.
      #
      # The identifiers are pinned, not derived from file names, because
      # identifier + team is the designated requirement macOS keys TCC grants,
      # Keychain ACLs and Background Items on: keep them fixed and an update is
      # the same program, change one and every install meets a stranger.
      # `dev.veld.daemon` and `dev.veld.helper` match the launchd labels in
      # `crates/veld-core/src/setup.rs`. `docs/macos-signing.md` has the table.
      #
      # `veld` and `veld-daemon` are signed WITHOUT the hardened runtime: it
      # strips DYLD_* from the environment of every child process, and these
      # two start the user's own dev servers. `macos-codesign.sh` asserts the
      # flag either way, so flipping it is a reviewed edit here, not drift.
      - name: Developer ID-sign the macOS binaries
        if: matrix.goos == 'darwin'
        run: |
          export KEYCHAIN="$RUNNER_TEMP/devid.keychain-db"
          identity=$(scripts/release/macos-keychain.sh import "$KEYCHAIN")
          sign=scripts/release/macos-codesign.sh
          bin=target/${{ matrix.target }}/release
          $sign --no-runtime "$identity" dev.veld.cli "$bin/veld"
          $sign --no-runtime "$identity" dev.veld.daemon "$bin/veld-daemon"
          $sign "$identity" dev.veld.helper "$bin/veld-helper"
          $sign "$identity" dev.veld.gateway "$bin/veld-gateway"
          $sign "$identity" dev.veld.caddy dist/caddy
          scripts/release/macos-keychain.sh delete "$KEYCHAIN"
        env:
          APPLE_DEVID_P12: ${{ secrets.APPLE_DEVID_P12 }}
          APPLE_DEVID_P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # The client tarball carries only what `install.sh` / `veld self update`
      # install on a developer machine. veld-gateway is a server binary — it
      # ships as its own artifact (below) so clients don't download a server
      # they never run, and install.sh's binary allow-list stays unchanged.
      - name: Package client binaries
        run: |
          mkdir -p dist
          for bin in veld veld-helper veld-daemon; do
            cp target/${{ matrix.target }}/release/$bin dist/
          done
          # Ship license + third-party attribution alongside the binaries
          # (MIT/Apache-2.0 etc. require the notices travel with the code).
          cp LICENSE THIRD-PARTY-LICENSES.md dist/
          # Sign the helper (issue #261) so a running root helper refuses to
          # relaunch onto a swapped, unsigned binary. On macOS the binaries were
          # Developer ID signed in the step above, first, for the reason given
          # there. On Linux there is no re-sign, so we ed25519-sign the raw build.
          #
          # The macOS runner is arm64, so only that leg can execute what it
          # built. Worth the seconds: a hardened-runtime binary that the kernel
          # refuses to start would otherwise ship and be found by users.
          if [ "${{ matrix.goos }}" = "darwin" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            dist/veld --version
            dist/veld-daemon --version
            dist/veld-helper --version
            dist/caddy version
          fi
          # Every Mach-O about to ship carries this team's signature — not just
          # the ones the signing step named. A binary added to the loop above
          # without a signing line, or the signing step moved below this one,
          # would otherwise ship with the linker's ad-hoc signature (or none, on
          # x86_64) and pass everything else here.
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            for f in dist/*; do
              file -b "$f" | grep Mach-O >/dev/null || continue
              codesign --verify --strict "$f"
              codesign -dv "$f" 2>&1 | grep -x "TeamIdentifier=$APPLE_TEAM_ID" >/dev/null \
                || { echo "::error::$f is not Developer ID signed for team $APPLE_TEAM_ID"; exit 1; }
            done
          fi
          # The helper must carry its own version inside the bytes about to be
          # signed (issue #262): the install RPC refuses a candidate it cannot
          # version, because an unversioned binary is one it cannot tell apart
          # from a downgrade. Nothing in the program reads that record — it
          # survives on `#[used]` alone — so a build that quietly lost it would
          # produce a release NO privileged install could ever update onto, and
          # the repair channel for that is asking every user for sudo, which is
          # the outcome this whole chain exists to avoid.
          #
          # Checked here rather than only in `cargo test` because this is the
          # cross-compiled artifact that actually ships, and it is the one thing
          # a host-architecture test cannot speak for. Failing the release is the
          # cheap outcome; shipping is not.
          # The magic and the field width below are hand-copied from
          # `veld_core::signing` (VERSION_MAGIC_OBFUSCATED / VERSION_MAGIC_KEY /
          # VERSION_FIELD_LEN) — there is no way to read Rust constants from a
          # shell step. What stops that duplication rotting silently is the last
          # assertion: the record must decode to the version this release is
          # being cut as. Change the record's layout without changing these
          # offsets and the extracted string stops matching, so the check fails
          # loudly instead of quietly validating a prefix of the new format.
          python3 - <<'PYCHECK'
          import os
          import sys
          magic = bytes(b ^ 0xA5 for b in bytes.fromhex(
              "ffa3297e793eedb20f1120c7f79c5cc2"))
          expected = os.environ["EXPECTED_VERSION"]
          data = open("dist/veld-helper", "rb").read()
          # Bounded on the full 48-byte record, not just the 16-byte magic, so a
          # match near EOF cannot read a truncated field — mirroring
          # `version_in_signed_bytes`'s `saturating_sub(VERSION_RECORD_LEN - 1)`.
          hits = [i for i in range(len(data) - 47) if data[i:i + 16] == magic]
          # Mirrors `veld_core::signing::parse_version_field`: a hit whose field
          # is not printable ASCII followed by NUL padding is NOT a record, and
          # the Rust reader skips it. Counting every occurrence of the magic
          # instead would let one unlucky 16-byte sequence in a dependency — or
          # a const-folded copy of the needle on some target — fail a release the
          # runtime would read perfectly.
          #
          # That reasoning holds, and v16.66.0 is the case it does not cover. A
          # const-folded needle is benign only while whatever the linker parked
          # behind it is *not* a well-formed field, and that is luck, not a rule:
          # the `x86_64-unknown-linux-gnu` helper folded one immediately before a
          # `rustls` error string, whose text is printable ASCII and therefore a
          # perfectly good field. Two records, two versions, and the runtime
          # reader would have returned `None` and refused the install on every
          # privileged machine — so the release failing here was correct.
          #
          # The lesson is about which side to fix. When this step fires, remove
          # the second record from the binary (see
          # `veld_core::signing::version_record_magic_at_runtime`); do not widen
          # the tolerance to quiet it, because this is the only gate that can see
          # the difference between the benign case above and that one.
          def field_version(raw):
              end = raw.find(b"\0")
              end = len(raw) if end < 0 else end
              if end == 0 or raw[end:].strip(b"\0"):
                  return None
              try:
                  text = raw[:end].decode("ascii")
              except UnicodeDecodeError:
                  return None
              ok = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-+"
              return text if all(c in ok for c in text) else None

          versions = {v for v in (field_version(data[i + 16:i + 48]) for i in hits) if v}
          if len(versions) != 1:
              sys.exit(
                  f"dist/veld-helper carries {len(hits)} version record(s) resolving to "
                  f"{sorted(versions)}; expected exactly one version. See "
                  "veld_core::signing::version_record and the VELD_HELPER_VERSION_RECORD "
                  "static in crates/veld-helper/src/main.rs."
              )
          found = versions.pop()
          if found != expected:
              sys.exit(
                  f"dist/veld-helper's version record says {found!r} but this release is "
                  f"{expected!r}. Either the record's layout changed and the offsets in this "
                  "step no longer match veld_core::signing, or the binary was built before "
                  "the version was stamped into Cargo.toml."
              )
          print(f"veld-helper version record: {found}")
          PYCHECK
          # veld-sign is a CI tool that must RUN on the runner, so it is built
          # for the host — never for ${{ matrix.target }}, whose binary is
          # cross-compiled (aarch64 on an x86_64 runner) and cannot execute here.
          cargo build --release -p veld-sign
          # **Rotating an org key needs no edit to this file.** The whole slot
          # layout — which keys a release is signed by, in which slot, and which
          # secret supplies each private half — is read out of
          # `crates/veld-core/src/signing.rs`'s ORG_KEYS table, which is the same
          # reviewed source the helper's own keyring is compiled from. Adding a key
          # is one row there plus one new repository secret; nothing here changes.
          # `docs/signing-key-rotation.md` is the runbook.
          #
          # `--slots` takes `<expected public key hex>=<VARIABLE>` per slot, in slot
          # order. Pairing the two halves in one token is what makes deriving them
          # safe: they cannot drift apart, and a row that went missing cannot shift
          # every later key one slot to the left — which would move slot 0, and slot
          # 0 belongs to the org's original key forever. Every helper shipped up to
          # v16.59.0 verifies bytes 0..64 against that one key and nothing else, so
          # a release whose slot 0 is anything else is a release NO privileged
          # install can relaunch onto, repairable only with sudo on every machine —
          # the one outcome #338's rules forbid.
          #
          # The expected-key half is the check nothing else in the pipeline can
          # make: if a signing secret is ever re-uploaded, rotated or created
          # holding a *different but valid* key, the PEM parses, a signature is
          # written and the release publishes — a signature by the wrong key is
          # indistinguishable from a correct one without knowing which key was
          # meant. It covers EVERY slot, not just slot 0: a wrong key in a later
          # slot ships invisibly (the release still installs everywhere via slot 0)
          # and then wedges every privileged install one release later, when that
          # key becomes the only one a helper accepts.
          #
          # Deriving it does not move the trust root anywhere. It reads git, not the
          # secret store — the point is that a reviewer can still see in reviewed
          # source which keys a release trusts and which it is signed by, and now
          # they cannot disagree with each other.
          #
          # `ci.yml`'s `schema` job runs the same script on every pull request and
          # checks each secret it names against this step's `env:` block below, so a
          # key added to the table without its secret being listed fails a pull
          # request instead of this push-only step, i.e. instead of failing after
          # merge.
          SLOTS="$(python3 tests/signing-slots.py)"
          echo "signing slots: $SLOTS"
          ./target/release/veld-sign --slots "$SLOTS" dist/veld-helper
          tar -czf veld-${{ needs.plan.outputs.new_release_version }}-${{ matrix.suffix }}.tar.gz -C dist .
        env:
          # **The permanent roster. Do not edit this block to rotate a key.**
          #
          # Eight names, the signature format's own slot ceiling
          # (`veld_core::signing::MAX_SIG_SLOTS`), listed once and never again.
          # Which of them a release actually uses is decided by the ORG_KEYS table
          # in `crates/veld-core/src/signing.rs`. A name no row names is simply an
          # environment variable that is not there, and `veld-sign` never asks for
          # it. A name a row DOES name must have its secret set — including a
          # **retired** row, whose slot is still produced on every release.
          # Deleting a retired key's secret breaks every release from then on, and
          # nothing can warn about it, because secrets cannot be enumerated.
          #
          # Listed rather than looked up because a workflow cannot enumerate
          # secrets: `ci.yml`'s own gate forbids `toJSON(secrets)` and any dynamic
          # index into the secrets context on every workflow a pull request can
          # start, deliberately. A fixed set of names whose presence at runtime
          # drives behaviour is the shape that IS expressible.
          #
          # SIGNING_PRIVATE_KEY holds the org's ORIGINAL key and is never
          # re-uploaded with different material — it is slot 0, which is a
          # compatibility contract with every already-shipped helper. A new key goes
          # in the next free number. Names are positional, never relative to now: an
          # `_OLD`/`_CURRENT` pair reads as the obvious scheme and puts the second
          # key in slot 0 on the second rotation, which strands the whole fleet.
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_2: ${{ secrets.SIGNING_PRIVATE_KEY_2 }}
          SIGNING_PRIVATE_KEY_3: ${{ secrets.SIGNING_PRIVATE_KEY_3 }}
          SIGNING_PRIVATE_KEY_4: ${{ secrets.SIGNING_PRIVATE_KEY_4 }}
          SIGNING_PRIVATE_KEY_5: ${{ secrets.SIGNING_PRIVATE_KEY_5 }}
          SIGNING_PRIVATE_KEY_6: ${{ secrets.SIGNING_PRIVATE_KEY_6 }}
          SIGNING_PRIVATE_KEY_7: ${{ secrets.SIGNING_PRIVATE_KEY_7 }}
          SIGNING_PRIVATE_KEY_8: ${{ secrets.SIGNING_PRIVATE_KEY_8 }}
          # Read by the version-record check above. Passed through the
          # environment rather than interpolated into the heredoc so the heredoc
          # stays quoted and the shell cannot touch the Python source.
          EXPECTED_VERSION: ${{ needs.plan.outputs.new_release_version }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # Gateway: separate per-arch tarball, consumed by the docker-gateway job
      # and attached to the release for operators who run it outside Docker.
      - name: Package gateway binary
        run: |
          mkdir -p dist-gateway
          cp target/${{ matrix.target }}/release/veld-gateway dist-gateway/
          cp LICENSE THIRD-PARTY-LICENSES.md dist-gateway/
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            codesign --verify --strict dist-gateway/veld-gateway
            codesign -dv dist-gateway/veld-gateway 2>&1 | grep -x "TeamIdentifier=$APPLE_TEAM_ID" >/dev/null \
              || { echo "::error::veld-gateway is not Developer ID signed for team $APPLE_TEAM_ID"; exit 1; }
          fi
          tar -czf veld-gateway-${{ needs.plan.outputs.new_release_version }}-${{ matrix.suffix }}.tar.gz -C dist-gateway .
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # Backstop for a signing step that failed between import and delete.
      - name: Remove the signing keychain
        if: always() && matrix.goos == 'darwin'
        run: scripts/release/macos-keychain.sh delete "$RUNNER_TEMP/devid.keychain-db"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veld-${{ matrix.suffix }}
          path: veld-*.tar.gz

  # ── Veld Desktop: the Electron app, from the same tag ──────────────
  # Rides this pipeline rather than a parallel one, so the app and the CLI ship
  # from one tag with one version (issue #167 §9) — both stamped from `plan`'s
  # output, exactly as the CLI's own `build` job already does. That is one
  # version *per run*; nothing here serializes runs, so two overlapping releases
  # are the pre-existing hole, and one this diff widens to a second manifest
  # rather than opens. The version is
  # written into package.json here for the same reason Cargo.toml's is: a release
  # is a tag only (#424), so the checkout never carries the version it ships as.
  #
  # macOS is Developer ID signed, notarized and stapled, so the app keeps one
  # code identity (dev.veld.desktop + the team) across updates — see
  # `docs/macos-signing.md`. The app does not yet replace itself on macOS
  # (`desktop/src/updatePolicy.js`); that is a separate switch. Linux is x64
  # only: there is no arm64 Linux runner in this matrix, and no reported demand.
  desktop:
    name: Build Desktop (${{ matrix.name }})
    permissions:
      contents: read
    needs: plan
    # Holds the Developer ID certificate and the notary API key; deploys only
    # from `main`. See the `build` job.
    environment: release
    # Notarization is a wait on Apple. Bounded so a stall cannot park a
    # 10×-billed macOS runner for GitHub's 6-hour default: ~20 min packaging, two
    # app notarizations inside electron-builder, two disk images at `--timeout
    # 15m` worst case.
    timeout-minutes: 90
    if: >-
      github.event_name == 'push'
      && needs.plan.outputs.new_release_published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            os: macos-latest
            run: npx electron-builder --mac --arm64 --x64 --publish never
            feed: latest-mac.yml
          # Two invocations, not one — see the target block in
          # electron-builder.yml for why the .deb must not share an output
          # directory with the AppImage. The script moves the .deb into dist/
          # afterwards, so everything published still comes from one directory.
          - name: linux
            os: ubuntu-24.04
            run: npm run package:linux
            feed: latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # Before `npm ci`, which refuses a package.json and lock that disagree.
      # `npm version` writes both.
      - name: Set release version
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.new_release_version }}

      - run: npm ci

      # Same script as the CLI binaries in `build`, and first, so a missing
      # secret fails before packaging. The notary key is written to RUNNER_TEMP
      # because electron-builder and notarytool both want a file; the last step
      # deletes it.
      #
      # Unlike `build`, the identity stays unlocked through packaging:
      # electron-builder IS the signer here, so its dependency tree runs with
      # the keychain unlocked and can call codesign. The key is imported
      # non-extractable, so it cannot be copied out of the keychain — but
      # `npm ci` ran earlier in this job and could have tampered with this
      # step, which has the .p12 itself in its environment. Same follow-up as
      # in `build`.
      - name: Import the Developer ID certificate and notary key
        id: devid
        if: matrix.name == 'macos'
        run: |
          kc="$RUNNER_TEMP/devid.keychain-db"
          identity=$(../scripts/release/macos-keychain.sh import "$kc")
          missing=
          [ -n "$APPLE_NOTARY_KEY_P8" ] || missing="$missing APPLE_NOTARY_KEY_P8"
          [ -n "$APPLE_NOTARY_KEY_ID" ] || missing="$missing APPLE_NOTARY_KEY_ID"
          [ -n "$APPLE_NOTARY_ISSUER_ID" ] || missing="$missing APPLE_NOTARY_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing in the 'release' environment:$missing — run scripts/release/apple-signing-setup.sh"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_NOTARY_KEY_P8" > "$key"
          chmod 600 "$key"
          {
            echo "identity=$identity"
            echo "keychain=$kc"
            echo "api_key=$key"
          } >> "$GITHUB_OUTPUT"
        env:
          APPLE_DEVID_P12: ${{ secrets.APPLE_DEVID_P12 }}
          APPLE_DEVID_P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      # `-c.mac.identity=<team id>` is the one place a real identity enters:
      # electron-builder.yml keeps `null`, so nothing but this step signs for
      # real. The team id qualifier matches only this team's certificate, found
      # in the keychain above via CSC_KEYCHAIN. electron-builder then signs with
      # the hardened runtime and entitlements, notarizes and staples the .app,
      # and only then builds the zip and dmg from it.
      #
      # electron-builder does NOT fail when it finds no identity or no notary
      # credentials — it warns and ships unsigned. The assertion step below is
      # what fails the release instead.
      - name: Package (signed and notarized)
        if: matrix.name == 'macos'
        run: ${{ matrix.run }} "-c.mac.identity=$APPLE_TEAM_ID"
        env:
          CSC_KEYCHAIN: ${{ steps.devid.outputs.keychain }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ steps.devid.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Package
        if: matrix.name != 'macos'
        run: ${{ matrix.run }}

      # The disk image needs its own signature and ticket: the one stapled
      # inside the .app does not cover the image, and an unnotarized image shows
      # the very Gatekeeper dialog this removes. `notarytool submit --wait` has
      # been seen to exit 0 on a rejection, so the verdict is read from its JSON
      # and Apple's reasons are fetched with `notarytool log` on failure.
      - name: Sign, notarize and staple the disk images
        if: matrix.name == 'macos'
        run: |
          set -eu
          set -- --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          for dmg in dist/*.dmg; do
            ../scripts/release/macos-codesign.sh --no-runtime "$IDENTITY" dev.veld.desktop.dmg "$dmg"
            # `|| true`: the verdict is the parsed status, so a non-zero exit
            # (Invalid, a timeout) still reaches the `notarytool log` below.
            submission=$(xcrun notarytool submit "$dmg" "$@" --wait --timeout 15m --output-format json) || true
            # Not JSON (an auth error, a crash) must still reach the ::error:: below.
            status=$(printf '%s' "$submission" | jq -r '.status // "unknown"' 2>/dev/null) || status=unparseable
            id=$(printf '%s' "$submission" | jq -r '.id // empty' 2>/dev/null) || id=""
            [ -n "$status" ] || status="no output"
            echo "$dmg: $status ($id)"
            if [ "$status" != "Accepted" ]; then
              if [ -n "$id" ]; then xcrun notarytool log "$id" "$@" || true; fi
              echo "::error::notarization of $dmg came back $status"
              exit 1
            fi
            # The ticket can take a moment to reach the CDN stapler reads from;
            # an immediate staple sometimes says "Record not found".
            for try in 1 2 3; do
              if xcrun stapler staple "$dmg"; then break; fi
              [ "$try" != 3 ] || { echo "::error::could not staple $dmg"; exit 1; }
              sleep 30
            done
          done
        env:
          IDENTITY: ${{ steps.devid.outputs.identity }}
          KEYCHAIN: ${{ steps.devid.outputs.keychain }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ steps.devid.outputs.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      # What shipped, not what the log claimed — checked on the artifacts users
      # download, unpacked the way they unpack them: the zip with `ditto` (how
      # install.sh and Squirrel extract it) and the dmg mounted. Each app must be
      # this team's Developer ID, identifier dev.veld.desktop with the team in
      # its designated requirement, hardened, and carry a stapled ticket.
      # `Authority=Developer ID Application:` alone would pass for any team's
      # certificate, and `stapler validate` for anything Apple ever notarized.
      - name: The macOS artifacts are signed, notarized and stapled
        if: matrix.name == 'macos'
        run: |
          set -eu
          check_app() {
            app=$1
            codesign --verify --deep --strict "$app"
            info=$(codesign -d --verbose=4 "$app" 2>&1)
            for want in "Identifier=dev.veld.desktop" "Authority=Developer ID Application: " "TeamIdentifier=$APPLE_TEAM_ID" "Timestamp="; do
              printf '%s\n' "$info" | awk -v s="$want" 'index($0, s) == 1 { f = 1 } END { exit !f }' \
                || { echo "::error::$app: missing '$want'"; exit 1; }
            done
            printf '%s\n' "$info" | grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' \
              || { echo "::error::$app: hardened runtime is off"; exit 1; }
            codesign -d -r- "$app" 2>&1 | grep -Eq "leaf\[subject\.OU\] = \"?$APPLE_TEAM_ID\"?" \
              || { echo "::error::$app: designated requirement does not pin the team"; exit 1; }
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          }
          work=$(mktemp -d)
          for zip in dist/*.zip; do
            dir="$work/$(basename "$zip" .zip)"
            ditto -x -k "$zip" "$dir"
            check_app "$dir/Veld.app"
          done
          for dmg in dist/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            mnt="$work/mnt-$(basename "$dmg" .dmg)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            check_app "$mnt/Veld.app"
            hdiutil detach "$mnt" >/dev/null
          done
          # The update feed must still describe the zips — `dmg.writeUpdateInfo:
          # false` drops only the disk images from it.
          grep -q '\.zip$' dist/latest-mac.yml \
            || { echo "::error::latest-mac.yml lists no zip"; cat dist/latest-mac.yml; exit 1; }
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      # `if-no-files-found: error` is all-or-nothing, so it cannot notice that
      # one glob matched nothing — and the update feed is the file whose absence
      # is invisible until an installed app checks for an update and is told
      # there is nothing to find.
      - name: The update feed was written
        run: test -f "dist/${{ matrix.feed }}"

      # The .yml files are electron-updater's feed and the blockmaps are how it
      # downloads a delta instead of 120 MB — both belong on the release beside
      # the installers, not just in the build's dist/.
      #
      # Every pattern must stay under **one** directory. upload-artifact roots
      # the artifact at the least common ancestor of its search *patterns* —
      # computed from the patterns, not from what exists — so adding a
      # `desktop/dist-deb/…` glob (even on a leg where that directory is never
      # created) re-roots everything at `desktop/` and nests the files a
      # directory deeper. `merge-multiple` then lands them in `artifacts/dist/`,
      # where the checksum step's `-maxdepth 1` misses them and
      # `files: artifacts/*` resolves to a directory that the release action
      # skips — a release with no app on it and nothing in the log to say so.
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veld-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

      - name: Remove the signing keychain and notary key
        if: always() && matrix.name == 'macos'
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          ../scripts/release/macos-keychain.sh delete "$RUNNER_TEMP/devid.keychain-db"

  # ── All builds passed → create the tag ─────────────────────────────
  release:
    name: Tag & Release
    needs: [plan, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      # A release is a tag and nothing else (#424): no version-bump commit goes
      # back to `main`. The binaries carry the version because `build` stamps it
      # in from `plan`, and a tag is all semantic-release needs to find the last
      # release next time. So the release never needs to write to `main` — which
      # is what lets it run while the maintainer's lock (scripts/dev/lock.sh)
      # holds `main` shut, and what removes the race two quick merges used to run
      # over that bump commit.
      - uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4
        id: semantic
        with:
          # Pin conventional-changelog-conventionalcommits to v9 — see the plan
          # job above for why (preset v10+ breaks release notes with writer@8).
          extra_plugins: |
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The artifacts were stamped and named with `plan`'s version; the tag comes
      # from this job's own run of semantic-release. They differ when an older
      # merge's run tagged after this run's `plan` read the tags: this run then
      # computes the version after the one it built. A tag naming a version
      # nothing was built as would strand every install (install.sh builds asset
      # names from the tag) and become the "latest release" that `git describe`
      # and the signing checks read. So take it back and stop — `publish` and
      # `docker-gateway` need this job. This merge is then released by the next
      # one, or by "Re-run all jobs" here (re-running only the failed jobs keeps
      # the stale `plan` and refuses again).
      - name: Refuse a tag the artifacts were not built as
        if: steps.semantic.outputs.new_release_git_tag != ''
        env:
          TAG: ${{ steps.semantic.outputs.new_release_git_tag }}
          BUILT_VERSION: ${{ needs.plan.outputs.new_release_version }}
        run: |
          # An empty BUILT_VERSION is a wiring fault, not a mismatch: deleting on
          # it would take back every release this job ever made.
          if [ -z "${BUILT_VERSION:-}" ]; then
            echo "::error::plan produced no version to compare $TAG against"
            exit 1
          fi
          if [ "$TAG" != "v$BUILT_VERSION" ]; then
            echo "::error::tagged $TAG but the artifacts were built as v$BUILT_VERSION; deleting the tag"
            git push origin --delete "$TAG"
            exit 1
          fi

  # ── Attach pre-built artifacts to the release ──────────────────────
  publish:
    name: Publish Artifacts
    permissions:
      contents: write
    needs: [plan, release]
    # A run whose `release` job tagged nothing has nothing to publish: a newer
    # merge landed while it built, semantic-release saw `main` move ("the local
    # branch main is behind the remote one") and stood down, and that newer run
    # releases both commits. Without this gate the job went red on every such
    # overlap (#416/#417), and docker-gateway pushed an image under a version
    # this run never tagged — built from the older commit's binaries.
    if: needs.release.outputs.new_release_git_tag != ''
    runs-on: ubuntu-latest
    # The publish step's own worst case is ~75 min, counting the `-k` grace
    # periods: 5 upload attempts at 600+30 s = 52.5 min, 225 s of upload
    # backoff, 5 publish attempts at 120+30 s plus 225 s of backoff = 16.25
    # min, and ~4 min across the capped, retried reads. 90 leaves room for the
    # ~1 GB artifact download ahead of it, so a wedged publish fails on its own
    # terms rather than being cancelled mid-flip with nothing in the log.
    timeout-minutes: 90
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true

      # Everything that lands on the release, not just the tarballs — the app
      # installers are downloaded by hand from a browser, which is exactly the
      # case a published checksum is for. `checksums.txt` itself is excluded
      # rather than filtered afterwards, since it is being written here.
      # install.sh looks its own tarball up by name, so extra lines are inert.
      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%P\0' \
            | sort -z | xargs -0r sha256sum > checksums.txt

      - name: Write release notes
        run: echo "$RELEASE_NOTES" > release-notes.md
        env:
          RELEASE_NOTES: ${{ needs.release.outputs.new_release_notes }}

      # `softprops/action-gh-release` lived here until it stranded v16.57.1. It
      # creates the release as a draft, uploads the assets, then flips
      # `draft=false` — and it has no retry on a 5xx. One asset upload sat for
      # five minutes and came back as GitHub's 500 HTML error page, the action
      # threw, the flip never ran, and the release stayed an invisible draft
      # while `releases/latest` still pointed at the previous version. Nothing
      # a user touches — `veld self update`, install.sh, Desktop auto-update — reads
      # a draft, so the release simply did not exist for them, and the only
      # signal was a red X on a job whose log was a page of HTML.
      #
      # So the publish is spelled out here. Same draft-first ordering, because
      # a release must never be visible carrying a partial asset set, plus the
      # properties the action lacked:
      #
      #   * every GitHub call is retried AND time-capped — the probe, the
      #     create, the uploads, the reads that decide whether an upload
      #     worked, and the flip that publishes. One unretried call is the
      #     whole incident, and the incident was a *hang*, not an error;
      #   * a retry re-sends only the assets still missing, not the ~700 MB
      #     that already landed;
      #   * "present" means the name AND the byte size AND `state == uploaded`
      #     all match, so a truncated or still-uploading asset is replaced
      #     rather than counted;
      #   * the flip is gated on that set being empty, and read back
      #     afterwards — `gh release edit` returning 0 is not the same fact as
      #     the release being published.
      #
      # The rule the whole step is built around: **every failure must fall
      # toward "do not publish"**. Every serious defect review found here was
      # the same shape — a check that answered "complete" when it meant "could
      # not tell". So each step below either establishes a fact or exits.
      #
      # Re-running the job is the recovery path: it finds the existing draft,
      # tops up what is missing, and publishes.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so gh cannot infer the repo.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.new_release_git_tag }}
          BUILT_VERSION: ${{ needs.plan.outputs.new_release_version }}
        run: |
          set -euo pipefail

          # An empty TAG is worse than a failure: `gh release view ""` returns
          # the repo's *latest published* release with exit 0, so the script
          # would read a previous release's assets, find them all "present",
          # and report success having published nothing.
          if [ -z "${TAG:-}" ]; then
            echo "::error::the release job produced no tag"
            exit 1
          fi

          # Second line of the check `release` already makes ("Refuse a tag the
          # artifacts were not built as"): install.sh builds asset names from the
          # tag, so a release under the wrong one would 404 on every asset.
          if [ "$TAG" != "v${BUILT_VERSION:-}" ]; then
            echo "::error::tag $TAG does not match the version these artifacts were built as (v${BUILT_VERSION:-})"
            exit 1
          fi

          # `artifacts/` has to be a flat directory of regular files. When an
          # upload-artifact glob re-roots (see the note on the desktop job), it
          # nests everything one level deeper, where `-maxdepth 1` silently
          # misses it — a release with no app on it and nothing in the log to
          # say so. That was already true of the checksum step; make it loud.
          find artifacts -mindepth 1 -maxdepth 1 -not -type f > nonfiles.txt
          if [ -s nonfiles.txt ]; then
            echo "::error::artifacts/ holds entries that are not regular files — an upload glob has re-rooted, or something produced a symlink:"
            cat nonfiles.txt
            exit 1
          fi

          # NUL-delimited, and written to a file rather than read through
          # `mapfile < <(find ...)`. Two separate traps: process substitution
          # hides the exit status from `set -e`, so a `find` that died halfway
          # would yield a short list nothing downstream can tell from a
          # complete one; and a newline in a filename would split one path into
          # two line-delimited entries, neither of which names a real file.
          find artifacts -maxdepth 1 -type f -print0 > expected.nul
          mapfile -d '' -t expected < expected.nul
          if [ "${#expected[@]}" -eq 0 ]; then
            echo "::error::no artifacts to publish for $TAG"
            exit 1
          fi

          # GitHub rewrites characters it dislikes in an asset filename — a
          # space becomes a `.` — and `gh release upload` reads `#` as an
          # asset-label separator. Either way the asset lands under a name the
          # completeness check below can never match, so the job would spend
          # all five upload rounds and then strand the release as a draft that
          # no re-run can clear: strictly worse than the incident this step
          # exists to fix. A newline is worse still, since it cannot survive
          # the tab-separated asset listing that check reads back.
          #
          # Rather than track GitHub's normalisation rules, require the
          # conservative set every artifact this repo builds already uses, and
          # fail where the message can still name the file.
          for file in "${expected[@]}"; do
            case ${file##*/} in
              *[!A-Za-z0-9._+-]*)
                echo "::error::artifact name is not safe as a release asset: ${file@Q}"
                echo "  allowed characters: letters, digits, and . _ + -"
                exit 1 ;;
            esac
          done

          # One read of the release, capped and retried. Returns empty on
          # failure, which every caller treats as "not yet" — the safe
          # direction, since the alternative is acting on a fact we do not have.
          release_field() {
            timeout -k 10 60 gh release view "$TAG" --json "$1" --jq ".$1" 2>/dev/null || true
          }

          # The probe and the create are GitHub calls too. Leaving them bare
          # meant the advertised top-up recovery was unavailable exactly when
          # GitHub was flaky, which is the only time it is needed.
          open_release() {
            local attempt delay=5
            for attempt in 1 2 3; do
              if timeout -k 10 60 gh release view "$TAG" >/dev/null 2>&1; then
                echo "Release $TAG already exists — topping it up."
                return 0
              fi
              if timeout -k 10 120 gh release create "$TAG" --draft --title "$TAG" \
                   --notes-file release-notes.md; then
                return 0
              fi
              # Either the probe 5xx'd and the release does exist, or the
              # create lost a race. Look again rather than calling it fatal.
              echo "Could not open a release for $TAG (attempt $attempt/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep "$delay"
                delay=$((delay * 3))
              fi
            done
            return 1
          }

          if ! open_release; then
            echo "::error::could not create or find a release for $TAG"
            exit 1
          fi

          # A 5xx on a read is the same failure class as a 5xx on an upload, so
          # it retries too. What it must never do is degrade to "assume
          # nothing is missing" — hence the hard `return 1` rather than a
          # `|| true`, and hence the caller aborting on it.
          read_assets() {
            local attempt delay=5
            for attempt in 1 2 3; do
              if timeout -k 10 60 gh release view "$TAG" --json assets \
                   --jq '.assets[] | select(.state == "uploaded") | "\(.name)\t\(.size)"' \
                   > have.tsv; then
                return 0
              fi
              echo "Could not read $TAG (attempt $attempt/3)."
              if [ "$attempt" -lt 3 ]; then
                sleep "$delay"
                delay=$((delay * 3))
              fi
            done
            return 1
          }

          # Sets the global `missing`. Every path out of here either reflects a
          # release we actually read, or exits the job.
          refresh_missing() {
            if ! read_assets; then
              echo "::error::gave up reading $TAG; leaving it a draft rather than guessing"
              exit 1
            fi
            declare -A have=()
            local name size file
            while IFS=$'\t' read -r name size; do
              have["$name"]="$size"
            done < have.tsv
            missing=()
            for file in "${expected[@]}"; do
              name=$(basename "$file")
              # Measured on its own line so that a failed `stat` aborts the job.
              # Inlined into the comparison it expands to "" — and "" is also
              # what an absent asset compares as, so a file we could not measure
              # scored as *present* and the release published without it.
              size=$(stat -c %s "$file")
              if [ "${have["$name"]-}" != "$size" ]; then
                missing+=("$file")
              fi
            done
          }

          backoff=15
          for attempt in 1 2 3 4 5; do
            refresh_missing
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -gt 1 ]; then
              echo "Retrying in ${backoff}s..."
              sleep "$backoff"
              backoff=$((backoff * 2))
            fi
            echo "Attempt $attempt: uploading ${#missing[@]} of ${#expected[@]} asset(s)."
            # A hang, not an error, is what cost v16.57.1 — the request sat for
            # five minutes before failing. Cap it and retry rather than wait it
            # out; `-k` because a wedged `gh` that ignores SIGTERM would
            # otherwise hold the job to its own ceiling. Killing an upload
            # mid-flight leaves a partial asset, which the size/state check
            # catches next pass and `--clobber` overwrites, so the timeout
            # cannot corrupt the release.
            timeout -k 30 600 gh release upload "$TAG" "${missing[@]}" --clobber || true
          done

          refresh_missing
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::$TAG is missing ${#missing[@]} asset(s) after 5 attempts; leaving it a draft"
            printf '  %s\n' "${missing[@]}"
            exit 1
          fi

          # The flip is what makes the release exist for users, and leaving it
          # as one unretried call would have reproduced the original incident
          # exactly: every asset up, and the release still invisible. It is
          # also read back, because the API accepting the call is not the same
          # fact as the release having left draft.
          #
          # `make_latest=legacy` — not gh's `--latest`, which hard-sets
          # `make_latest=true`. The difference shows on the recovery path this
          # step advertises: publishing an OLD stranded draft after a newer
          # release has shipped would, with `true`, re-point `releases/latest`
          # backwards, and install.sh resolves `/releases/latest`, so every
          # `curl | bash` install and `veld self update` would silently downgrade.
          # `legacy` lets GitHub choose by version and date, which is right for
          # a normal release and for a late top-up alike.
          publish() {
            local attempt delay=15 id
            for attempt in 1 2 3 4 5; do
              id=$(release_field databaseId)
              if [ -n "$id" ]; then
                timeout -k 30 120 gh api -X PATCH "repos/$GH_REPO/releases/$id" \
                  -F draft=false -f make_latest=legacy >/dev/null 2>&1 || true
              fi
              if [ "$(release_field isDraft)" = "false" ]; then
                return 0
              fi
              echo "$TAG is not published yet (attempt $attempt/5)."
              if [ "$attempt" -lt 5 ]; then
                sleep "$delay"
                delay=$((delay * 2))
              fi
            done
            return 1
          }

          if ! publish; then
            # Deliberately not "it is still a draft": reaching here can also
            # mean the flip landed and only the read-back failed. Claiming the
            # stronger fact would be the same mistake this step is built to
            # avoid, one step further out.
            echo "::error::$TAG carries all ${#expected[@]} assets but could not be confirmed published; re-run this job to check"
            exit 1
          fi
          echo "Published $TAG with ${#expected[@]} assets."

  # ── Gateway container image (multi-arch, from the built binaries) ──
  docker-gateway:
    name: Publish veld-gateway image
    permissions:
      contents: read
      packages: write
    needs: [plan, release]
    # Same gate as `publish` — see there.
    if: needs.release.outputs.new_release_git_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Pattern-filtered: without it this pulls every desktop installer too —
      # hundreds of megabytes this job has no use for.
      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: veld-linux-*
          path: artifacts
          merge-multiple: true

      # Stage the per-arch veld-gateway binaries where the Dockerfile's
      # TARGETARCH COPY expects them — no second compile.
      - name: Stage gateway binaries
        run: |
          VERSION="${{ needs.plan.outputs.new_release_version }}"
          mkdir -p dist/amd64 dist/arm64
          # The tarballs are packed with `-C dist-gateway .`, so the binary is
          # stored as `./veld-gateway` — extract everything instead of naming
          # the member, which GNU tar would reject as "Not found in archive".
          tar -xzf "artifacts/veld-gateway-${VERSION}-linux-amd64.tar.gz" -C dist/amd64
          tar -xzf "artifacts/veld-gateway-${VERSION}-linux-arm64.tar.gz" -C dist/arm64

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: crates/veld-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veld-gateway:${{ needs.plan.outputs.new_release_version }}
            ghcr.io/${{ github.repository_owner }}/veld-gateway:latest
