name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  # ── Plan: semantic-release dry run to show next version ──────────────
  # Runs on both push and PR. On PR, checks out the merge ref and
  # pretends it's main so semantic-release computes the real version.
  plan:
    name: Plan Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On PR, the checkout is a detached merge ref — semantic-release
      # needs to see branch "main" to match .releaserc.json config.
      - name: Point local main at merge commit
        if: github.event_name == 'pull_request'
        run: git checkout -B main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          dry_run: true
          # conventional-changelog-conventionalcommits is pinned to v9:
          # @semantic-release/release-notes-generator@14 bundles
          # conventional-changelog-writer@8, and the conventionalcommits preset
          # v10+ emits writerOpts incompatible with it — the release notes body
          # comes out empty (header only). v9 matches the bundled writer. The
          # empty-notes regression started with #128, which added this preset.
          # NOTE: keep this list free of "#" comments — the action runs
          # `npm install` on every non-empty line verbatim.
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build ALL artifacts BEFORE tagging ─────────────────────────────
  build:
    name: Build (${{ matrix.suffix }})
    permissions:
      contents: read
    needs: plan
    if: >-
      github.event_name == 'push'
      && needs.plan.outputs.new_release_published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            goos: darwin
            goarch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            goos: darwin
            goarch: amd64
          # Pinned to 24.04 (not ubuntu-latest) so the release binaries' glibc
          # matches the gateway image's ubuntu:24.04 base — when GitHub promotes
          # ubuntu-latest to a newer release the binaries would link a glibc the
          # base image lacks, breaking the container at startup.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            suffix: linux-amd64
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            suffix: linux-arm64
            cross: true
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/veld-daemon/frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd crates/veld-daemon/frontend && npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Set release version in Cargo.toml
        run: |
          VERSION="${{ needs.plan.outputs.new_release_version }}"
          sed -i'' -e "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Caddy with veld_inject
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          XCADDY_VERSION=$(cat .xcaddy-version)
          go install "github.com/caddyserver/xcaddy/cmd/xcaddy@v${XCADDY_VERSION}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} xcaddy build \
            --with github.com/prosperity-solutions/veld/caddy/inject=./caddy/inject \
            --output dist/caddy
          chmod +x dist/caddy

      # The client tarball carries only what `install.sh` / `veld update`
      # install on a developer machine. veld-gateway is a server binary — it
      # ships as its own artifact (below) so clients don't download a server
      # they never run, and install.sh's binary allow-list stays unchanged.
      - name: Package client binaries
        run: |
          mkdir -p dist
          for bin in veld veld-helper veld-daemon; do
            cp target/${{ matrix.target }}/release/$bin dist/
          done
          # Ship license + third-party attribution alongside the binaries
          # (MIT/Apache-2.0 etc. require the notices travel with the code).
          cp LICENSE THIRD-PARTY-LICENSES.md dist/
          tar -czf veld-${{ needs.plan.outputs.new_release_version }}-${{ matrix.suffix }}.tar.gz -C dist .

      # Gateway: separate per-arch tarball, consumed by the docker-gateway job
      # and attached to the release for operators who run it outside Docker.
      - name: Package gateway binary
        run: |
          mkdir -p dist-gateway
          cp target/${{ matrix.target }}/release/veld-gateway dist-gateway/
          cp LICENSE THIRD-PARTY-LICENSES.md dist-gateway/
          tar -czf veld-gateway-${{ needs.plan.outputs.new_release_version }}-${{ matrix.suffix }}.tar.gz -C dist-gateway .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veld-${{ matrix.suffix }}
          path: veld-*.tar.gz

  # ── Veld Desktop: the Electron app, from the same tag ──────────────
  # Rides this pipeline rather than a parallel one, so the app and the CLI ship
  # from one tag with one version (issue #167 §9) — both stamped from `plan`'s
  # output, exactly as the CLI's own `build` job already does. That is one
  # version *per run*; nothing here serializes runs, so two overlapping releases
  # are the pre-existing hole, and one this diff widens to a second manifest
  # rather than opens. The version is
  # written into package.json here for the same reason Cargo.toml's is: this all
  # runs *before* semantic-release commits the bump, so the checkout is still on
  # the previous version.
  #
  # macOS is signed with the team's Developer ID, notarized and stapled (issue
  # #167 §10) — the app, by electron-builder, and each disk image afterwards,
  # because Gatekeeper assesses the file the user actually downloads. That takes the
  # certificate plus one of two notarization credential sets (see the credentials
  # step); they are asserted before packaging starts and the result is asserted on
  # the artifacts, since every way electron-builder can fail to sign or notarize is a
  # *warning*. Linux is x64 only: there is no arm64 Linux runner in this matrix, and
  # no reported demand.
  desktop:
    name: Build Desktop (${{ matrix.name }})
    permissions:
      contents: read
    needs: plan
    # The signing secrets live in this environment, not in the repository — a
    # Developer ID private key readable by any workflow run on any branch is one
    # push away from being extracted, and the macOS self-update this diff enables
    # makes that key the *only* thing standing between a release and code execution
    # on every install. The environment restricts it to `main`; see
    # desktop/ARCHITECTURE.md → "Signing and notarization" for the setup, which has
    # to exist before this workflow can produce a release.
    environment: release
    # Notarization is a wait on Apple. An unbounded one parks a 10×-billed runner
    # until GitHub's 6-hour default and blocks the tag behind it.
    #
    # The number has to clear the sum of what runs inside it, or the per-submission
    # `--timeout` below can never fire first and a notary stall is a bare
    # cancellation with no `notarytool log`: ~20 min of packaging, two app
    # notarizations electron-builder does *without* a timeout, and two disk images at
    # `--timeout 15m` worst case. A healthy release is ~35 min.
    timeout-minutes: 90
    if: >-
      github.event_name == 'push'
      && needs.plan.outputs.new_release_published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos
            os: macos-latest
            run: npx electron-builder --mac --arm64 --x64 --publish never
            feed: latest-mac.yml
          # Two invocations, not one — see the target block in
          # electron-builder.yml for why the .deb must not share an output
          # directory with the AppImage. The script moves the .deb into dist/
          # afterwards, so everything published still comes from one directory.
          - name: linux
            os: ubuntu-24.04
            run: npm run package:linux
            feed: latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # Before `npm ci`, which refuses a package.json and lock that disagree.
      # `npm version` writes both.
      - name: Set release version
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
        env:
          VERSION: ${{ needs.plan.outputs.new_release_version }}

      - run: npm ci

      # Fail before spending ten minutes of a 10×-billed runner, and fail where the
      # cause is legible. Nothing downstream would: electron-builder skips signing
      # with a warning when it cannot find the certificate, and skips notarization
      # with a warning when the credentials are absent. Blocking the whole release
      # (this job is `fail-fast`, and `release` needs it) is the intended cost —
      # `desktop/src/updatePolicy.js` now tells installed macOS apps they may
      # replace themselves, which is only true of a signed build, so shipping an
      # unsigned one would strand every existing install on a broken update path.
      #
      # Notarization accepts either credential set Apple offers, because which one
      # a team can produce is an org-politics question, not a technical one:
      #
      #   - An **App Store Connect API key** (`APPLE_API_KEY_P8` +
      #     `APPLE_API_KEY_ID` + `APPLE_API_ISSUER`) belongs to the team, so a
      #     release does not depend on one person's Apple account still existing.
      #     Only the Account Holder can mint one. Preferred.
      #   - An **Apple ID + app-specific password** (`APPLE_ID` +
      #     `APPLE_APP_SPECIFIC_PASSWORD`), which any team member can produce for
      #     themselves.
      #
      # `APPLE_TEAM_ID` is required either way — not for notarization (the API-key
      # route does not need it) but for the identity assertion further down, which
      # is the only thing that can tell the *right* Developer ID certificate from
      # any other team's.
      #
      # This step decides which route is in play and writes **nothing secret**
      # anywhere: only the route name and the key's path leave it as outputs. The
      # obvious alternative — exporting the chosen credentials through $GITHUB_ENV —
      # is worse twice over: `echo "NAME=$VALUE"` turns one stray newline in a
      # secret into arbitrary further assignments (`NODE_OPTIONS=--require=…`
      # honoured by the signing step), and every later step in the job inherits
      # them, including third-party actions on mutable tags.
      - name: Choose the macOS notarization credentials
        id: creds
        if: matrix.name == 'macos'
        env:
          # An environment *variable*, not a secret. Be precise about what it proves,
          # because it is easy to overstate: only that a variable of this name is
          # visible to this job. It catches the release-environment setup never having
          # been done at all — the likely miss — and nothing more. It cannot see where
          # a secret came from (`secrets.*` resolves repository secrets too, with
          # environment ones merely taking precedence), and `vars.*` resolves
          # repository variables as well, so a variable set on the wrong page also
          # satisfies it.
          #
          # So both halves of the actual protection — the secrets living in the
          # environment rather than the repository, and the environment's deployment
          # branches being restricted to `main` — stay manual preconditions. They are
          # written down as a numbered procedure in desktop/ARCHITECTURE.md, which is
          # what the error message below points at.
          SIGNING_ENVIRONMENT: ${{ vars.VELD_SIGNING_ENVIRONMENT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -eu
          if [ "${SIGNING_ENVIRONMENT-}" != "release" ]; then
            echo "::error::the 'release' environment is not set up — define its variable VELD_SIGNING_ENVIRONMENT=release *in the environment* (Settings → Environments → release → Variables), and keep the signing secrets there rather than in repository secrets. See desktop/ARCHITECTURE.md → 'Signing and notarization'"
            exit 1
          fi
          missing=
          [ -n "${CSC_LINK-}" ] || missing="$missing CSC_LINK"
          [ -n "${CSC_KEY_PASSWORD-}" ] || missing="$missing CSC_KEY_PASSWORD"
          [ -n "${APPLE_TEAM_ID-}" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing secrets in the 'release' environment:$missing — see desktop/ARCHITECTURE.md → 'Signing and notarization' for how each one is produced"
            exit 1
          fi

          if [ -n "${APPLE_API_KEY_P8-}" ] && [ -n "${APPLE_API_KEY_ID-}" ] && [ -n "${APPLE_API_ISSUER-}" ]; then
            # @electron/notarize and notarytool both want the key as a *file*. The
            # runner is ephemeral and RUNNER_TEMP is outside the workspace, so it
            # cannot be picked up by a glob or packed into an artifact. Unlike an
            # environment variable it does outlive this step, which is why the last
            # step of the job deletes it.
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "route=api" >> "$GITHUB_OUTPUT"
            echo "api_key_path=$key" >> "$GITHUB_OUTPUT"
            echo "notarizing with an App Store Connect API key"
          elif [ -n "${APPLE_ID-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD-}" ]; then
            echo "route=apple-id" >> "$GITHUB_OUTPUT"
            echo "api_key_path=" >> "$GITHUB_OUTPUT"
            echo "notarizing with an Apple ID and app-specific password"
          else
            echo "::error::no complete notarization credentials — set either APPLE_API_KEY_P8 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD. See desktop/ARCHITECTURE.md → 'Signing and notarization'"
            exit 1
          fi

      # Two Package steps for one command, so the certificate never enters the Linux
      # runner's environment. electron-builder imports CSC_LINK into a throwaway
      # keychain, finds the identity named by `mac.identity`, signs with the hardened
      # runtime and entitlements, then notarizes and staples the .app before the dmg
      # and zip are built from it.
      #
      # Only the chosen route's variables are non-empty. That is load-bearing rather
      # than tidy: `getNotarizeOptions` checks `APPLE_ID` *first* and throws if its
      # partners are missing, so leaking a stray `APPLE_ID` into the API-key route
      # would fail the build outright. An empty string reads as absent.
      - name: Package (signed and notarized)
        if: matrix.name == 'macos'
        run: ${{ matrix.run }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ steps.creds.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ steps.creds.outputs.route == 'api' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.creds.outputs.route == 'api' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ steps.creds.outputs.route == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.creds.outputs.route == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ steps.creds.outputs.route == 'apple-id' && secrets.APPLE_TEAM_ID || '' }}

      - name: Package
        if: matrix.name != 'macos'
        run: ${{ matrix.run }}

      # The disk image needs its own notarization ticket: the one electron-builder
      # stapled is inside the .app, and an unnotarized image shows the very dialog
      # this exists to remove when it is mounted. Sequential on purpose — bash 3.2
      # on the runner has no `wait -n`, and a backgrounded round trip that fails
      # would surface as a confusing staple error instead of Apple's own message.
      #
      # `notarytool submit --wait` has been reported to exit 0 on a rejected
      # submission, so the status is read out of its JSON and `notarytool log`
      # fetches Apple's reasons — an `Invalid` verdict otherwise surfaces as a bare
      # "could not find ticket" from stapler, with the actual cause (an unsigned
      # nested binary, a missing entitlement) left on Apple's server. `--timeout`
      # bounds the wait; the job's own `timeout-minutes` is the backstop for the
      # notarization electron-builder does inside the packaging step.
      - name: Notarize and staple the disk images
        if: matrix.name == 'macos'
        env:
          APPLE_API_KEY: ${{ steps.creds.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ steps.creds.outputs.route == 'api' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.creds.outputs.route == 'api' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ steps.creds.outputs.route == 'apple-id' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ steps.creds.outputs.route == 'apple-id' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          # notarytool spells the credentials differently from the environment
          # variables electron-builder reads, so they are re-expressed as arguments.
          if [ -n "$APPLE_API_KEY" ]; then
            set -- --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          else
            set -- --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
          fi
          for dmg in dist/*.dmg; do
            echo "notarizing $dmg"
            submission=$(xcrun notarytool submit "$dmg" "$@" --wait --timeout 15m --output-format json)
            status=$(printf '%s' "$submission" | jq -r '.status // "unknown"')
            id=$(printf '%s' "$submission" | jq -r '.id // empty')
            echo "$dmg → $status ($id)"
            if [ "$status" != "Accepted" ]; then
              [ -n "$id" ] && xcrun notarytool log "$id" "$@" || true
              echo "::error::notarization of $dmg came back $status"
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done

      # What the log claimed is not what shipped. Both arches: electron-builder
      # writes x64 to dist/mac and arm64 to dist/mac-arm64, and signs each on its
      # own. The zip needs no check of its own — it is packed from the .app verified
      # here, ticket included.
      #
      # Three assertions, not one, because each of the first two passes for the
      # wrong artifact on its own: `Authority=Developer ID Application:` holds for
      # *any* team's certificate and `stapler validate` for anything Apple ever
      # notarized, so a wrong `.p12` — hand-made, once, by someone who is not the
      # person merging this — would sign, notarize and ship. `TeamIdentifier` pins
      # whose certificate it is and `Identifier` pins which app, and both matter
      # beyond this release: Squirrel.Mac refuses a replacement whose signature does
      # not match the running app's, so a silent team change breaks self-update on
      # every install that already exists.
      - name: The macOS artifacts are Developer ID signed, notarized and stapled
        if: matrix.name == 'macos'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          # Read out of the packaging config rather than restated here, so renaming the
          # bundle id stays a one-line change and this still compares the artifact
          # against what it was supposed to be built as. Tolerates the legal YAML
          # spellings of the value (quoted, extra spaces, a trailing comment); anything
          # it cannot read comes out empty and fails on the next line rather than
          # silently asserting nothing.
          app_id=$(sed -n 's/^appId:[[:space:]]*["'"'"']\{0,1\}\([^"'"'"'[:space:]#]*\).*/\1/p' electron-builder.yml)
          [ -n "$app_id" ] || { echo "::error::could not read appId from desktop/electron-builder.yml"; exit 1; }

          # $1 = artifact, $2… = literal prefixes one of its signature's lines must
          # start with.
          assert_signature() {
            target=$1
            shift
            # `codesign --display` reports on stderr, hence the redirect — and `||
            # true`, because under `set -e` a non-zero codesign exit would kill the
            # step from inside this assignment: no annotation, no report, an empty
            # log for the one step whose job is to say what went wrong. An unsigned
            # artifact is exactly that case (`signDmg` returns silently when there is
            # no identity), so the failure has to be reported below.
            report=$(codesign --display --verbose=2 "$target" 2>&1 || true)
            for expected in "$@"; do
              # `awk`'s `index($0, s) == 1` is a **literal prefix** test, which is what
              # this needs and what neither grep flag gives on its own: `-F` is literal
              # but cannot anchor, and `-E` anchors but turns the dots in
              # `Identifier=dev.veld.desktop` into wildcards that accept
              # `devXveldYdesktop`. Anchoring matters because it is what makes this the
              # same predicate as `isDeveloperIdSigned`'s `/^Authority=…/m` — one
              # definition of "signed", asserted at both ends. Two earlier spellings of
              # this test were wrong in opposite directions, and a shell-quoting one
              # (`case` against `$(printf '\n')`, which is the empty string) failed
              # *open* while reading as if it anchored.
              if ! printf '%s\n' "$report" \
                | awk -v s="$expected" 'index($0, s) == 1 { found = 1 } END { exit !found }'; then
                echo "::error::$target is not the expected signed artifact — no line starting '$expected' in its signature"
                printf '%s\n' "$report"
                exit 1
              fi
            done
          }
          for app in dist/mac-arm64/Veld.app dist/mac/Veld.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            assert_signature "$app" \
              "Authority=Developer ID Application:" \
              "TeamIdentifier=$APPLE_TEAM_ID" \
              "Identifier=$app_id"
            xcrun stapler validate "$app"
          done
          # The disk image is signed and notarized separately from the app inside it,
          # so it is asserted separately — minus the bundle identifier, which for a
          # disk image codesign derives from the file name rather than from
          # Info.plist, and plus the secure timestamp. That last one is not
          # decoration: electron-builder signs the image without an explicit
          # `--timestamp` (`dmg-builder/out/dmg.js`), codesign's default is
          # documented as "may result in some but not all code signatures being
          # timestamped", and Apple's notary service rejects a signature without one.
          # If this is what fails the first signed release, the fix is to sign the
          # image here with `codesign --timestamp` instead of letting the packager do
          # it — asserted rather than assumed because it cannot be tested without the
          # certificate.
          for dmg in dist/*.dmg; do
            assert_signature "$dmg" \
              "Authority=Developer ID Application:" \
              "TeamIdentifier=$APPLE_TEAM_ID" \
              "Timestamp="
            xcrun stapler validate "$dmg"
          done

      # `if-no-files-found: error` is all-or-nothing, so it cannot notice that
      # one glob matched nothing — and the update feed is the file whose absence
      # is invisible until an installed app checks for an update and is told
      # there is nothing to find.
      - name: The update feed was written
        run: test -f "dist/${{ matrix.feed }}"

      # The .yml files are electron-updater's feed and the blockmaps are how it
      # downloads a delta instead of 120 MB — both belong on the release beside
      # the installers, not just in the build's dist/.
      #
      # Every pattern must stay under **one** directory. upload-artifact roots
      # the artifact at the least common ancestor of its search *patterns* —
      # computed from the patterns, not from what exists — so adding a
      # `desktop/dist-deb/…` glob (even on a leg where that directory is never
      # created) re-roots everything at `desktop/` and nests the files a
      # directory deeper. `merge-multiple` then lands them in `artifacts/dist/`,
      # where the checksum step's `-maxdepth 1` misses them and
      # `files: artifacts/*` resolves to a directory that the release action
      # skips — a release with no app on it and nothing in the log to say so.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: veld-desktop-${{ matrix.name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml
          if-no-files-found: error

      # The API key is a file, so it outlives the step that wrote it and every later
      # step — including third-party actions — can read it. `always()` so a failed
      # notarization does not leave it behind either. The runner is ephemeral, so
      # this is defence in depth rather than the only thing standing between the key
      # and the outside.
      - name: Remove the App Store Connect API key
        if: always() && matrix.name == 'macos'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  # ── All builds passed → create the tag ─────────────────────────────
  release:
    name: Tag & Release
    needs: [plan, build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      new_release_notes: ${{ steps.semantic.outputs.new_release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          # Pin conventional-changelog-conventionalcommits to v9 — see the plan
          # job above for why (preset v10+ breaks release notes with writer@8).
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            conventional-changelog-conventionalcommits@^9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Attach pre-built artifacts to the release ──────────────────────
  publish:
    name: Publish Artifacts
    permissions:
      contents: write
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Everything that lands on the release, not just the tarballs — the app
      # installers are downloaded by hand from a browser, which is exactly the
      # case a published checksum is for. `checksums.txt` itself is excluded
      # rather than filtered afterwards, since it is being written here.
      # install.sh looks its own tarball up by name, so extra lines are inert.
      - name: Generate checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name checksums.txt -printf '%P\0' \
            | sort -z | xargs -0r sha256sum > checksums.txt

      - name: Write release notes
        run: echo "$RELEASE_NOTES" > release-notes.md
        env:
          RELEASE_NOTES: ${{ needs.release.outputs.new_release_notes }}

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.new_release_git_tag }}
          name: ${{ needs.release.outputs.new_release_git_tag }}
          body_path: release-notes.md
          files: artifacts/*

  # ── Gateway container image (multi-arch, from the built binaries) ──
  docker-gateway:
    name: Publish veld-gateway image
    permissions:
      contents: read
      packages: write
    needs: [plan, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pattern-filtered: without it this pulls every desktop installer too —
      # hundreds of megabytes this job has no use for.
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: veld-linux-*
          path: artifacts
          merge-multiple: true

      # Stage the per-arch veld-gateway binaries where the Dockerfile's
      # TARGETARCH COPY expects them — no second compile.
      - name: Stage gateway binaries
        run: |
          VERSION="${{ needs.plan.outputs.new_release_version }}"
          mkdir -p dist/amd64 dist/arm64
          # The tarballs are packed with `-C dist-gateway .`, so the binary is
          # stored as `./veld-gateway` — extract everything instead of naming
          # the member, which GNU tar would reject as "Not found in archive".
          tar -xzf "artifacts/veld-gateway-${VERSION}-linux-amd64.tar.gz" -C dist/amd64
          tar -xzf "artifacts/veld-gateway-${VERSION}-linux-arm64.tar.gz" -C dist/arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/veld-gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/veld-gateway:${{ needs.plan.outputs.new_release_version }}
            ghcr.io/${{ github.repository_owner }}/veld-gateway:latest
