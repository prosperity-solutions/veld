name: CI

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default type set (opened, synchronize,
    # reopened) and every job below refuses to run while the PR is a draft, so
    # the two halves are required together: without this line, flipping a draft
    # to ready fires nothing and the PR sits forever with no checks.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Supersede an in-flight run when the same PR is pushed again. Two details that
# are easy to get wrong, and one of them was:
#
#   * `cancel-in-progress: false` does NOT mean "a run in this group is never
#     cancelled". Actions also cancels any *pending* run in the group when a newer
#     one arrives, independently of this flag. So keying main pushes on
#     `github.ref` — one shared `refs/heads/main` group — would mean three merges
#     in quick succession silently drop the middle one's run. `github.sha` gives
#     every main push its own group, which is what it had before this block
#     existed: parallel, never superseded.
#   * `github.workflow` is part of the key so CI and Release never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ── Draft PRs do not run CI ───────────────────────────────────────────
#
# Every job below carries its own copy of the draft guard, in one of two forms:
#
#   if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
#   if: github.event_name == 'pull_request' && github.event.pull_request.draft == false   # PR-only jobs
#
# A draft PR is where an agent's intermediate commits land, and a pull_request run
# of this workflow occupies five macOS legs — `integration`, `injection-test`, the
# mac leg of `desktop-package`, and both darwin legs of `release-build` — plus a
# four-target release build matrix. Standard macOS runners are free on public
# repositories, so what a draft run costs is *runner time and the account's macOS
# concurrency allowance*: five simultaneous mac jobs is a large share of it, and a
# draft's runs queue ahead of work that matters. (The same legs bill at 10× a
# Linux minute wherever Actions billing does apply, which is why the shape is
# worth keeping small even here.) The house workflow (AGENTS.md → PR Workflow) is
# local review first and ready-for-review second, so a draft has by definition not
# earned a run yet. A push to a draft still creates a workflow run, but every job
# in it skips.
#
# **A skipped job reports as a *successful* check run.** That is Actions'
# behaviour, not something this workflow chose, and it is the trap here: a draft
# PR looks green rather than looking unrun. Never conclude "CI passed" from a
# check summary without confirming the PR is out of draft — see the CI cost
# convention in AGENTS.md for the two commands that tell the cases apart.
#
# The guard is repeated per job rather than hoisted. Actions has no
# workflow-level `if`, and while YAML anchors *are* supported (GA since
# 2025-09-18), the documented pattern is to define the anchor on first use — i.e.
# inside one job — which would make every other job's guard depend on that one
# job's continued existence and position in the file. A copy per job stays
# greppable and independently deletable, and the typo drift an anchor would
# prevent is already caught by the gate below.
#
# Leaning on `needs:` to cascade the skip into dependent jobs would work today
# and silently stop working the day someone drops a `needs:`, so
# `tests/validate-workflow-gates.py` asserts the invariant instead: every job is
# draft-guarded, push-only, or a dependent that cannot outlive a skipped root.
#
# Do not add a status function — `always()`, `cancelled()`, `failure()`,
# `success()`, in any negated spelling — to a job that relies on the cascade
# rather than on its own guard, and do not OR the guard with another condition —
# `true || <guard>` gates nothing, and `A || <guard> && X` binds as `A || (guard
# && X)`. All of these are holes the gate looks for.
#
# KNOWN BLIND SPOT, stated rather than implied: the gate runs inside the `schema`
# job, which is itself draft-guarded, so it cannot fire on the run where a missing
# guard actually costs something. A new unguarded job will run on draft pushes
# until the PR is marked ready and `schema` finally reports. `just workflow-gates`
# locally is the real mitigation, and docs/agentic-review.md §1.1 requires it
# whenever a change touches this directory. Making the gate an unguarded sentinel
# job would close it for ~1 ubuntu minute per draft push; that is a policy call
# for the maintainer, not a silent one — see the PR that introduced this.
jobs:
  commits:
    permissions:
      contents: read
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate PR commits follow conventional format
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .+'
          FAILED=0
          while IFS= read -r sha; do
            MSG=$(git log --format='%s' -1 "$sha")
            if ! echo "$MSG" | grep -qE "$PATTERN"; then
              echo "❌ $sha: $MSG"
              FAILED=1
            else
              echo "✅ $sha: $MSG"
            fi
          done < <(git rev-list "$BASE".."$HEAD")
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Some commits do not follow conventional commit format."
            echo "Expected: type(scope)?: description"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

  website:
    permissions:
      contents: read
    name: Website Docker Build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build website container
        run: docker build -t veld-website website/

  schema:
    permissions:
      contents: read
    name: Validate JSON Schema & Workflow Gates
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Two commits, so that on a pull request the merge commit's own parents
          # are present: `HEAD^1` is the base GitHub merged against and `HEAD^2` is
          # the pull request head. `One release never both adds a key and retires
          # one` below is the only step that needs it — everything else in this job
          # is static and reads the tree.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate schema and configs
        run: |
          chmod +x tests/validate-schema.sh
          ./tests/validate-schema.sh --install
      # Homed here because this is the one job that already has a managed Python
      # and does static, checkout-only validation. Nothing in Actions enforces
      # that a newly added job carries the draft guard, and the symptom of a
      # missing one is a bill rather than a failure, so it gets a drift gate —
      # the same reason THIRD-PARTY-LICENSES.md and desktop/assets have one.
      - name: Workflows do not run on draft PRs
        run: |
          # Pinned to a major, same reasoning as cargo-about above: an unpinned
          # install makes this job's behaviour depend on the day it ran.
          pip install "pyyaml>=6,<7"
          # --selftest first: it asserts the gate still detects the holes it
          # claims to. A gate that has rotted into `return []` passes the real
          # check trivially, which reads as a clean bill of health.
          python3 tests/validate-workflow-gates.py --selftest
          python3 tests/validate-workflow-gates.py
          # Same rule for the org key table's parser: its fixtures are mis-parses
          # it must refuse, and a parser that quietly returns a shorter list than
          # the table has is a release missing a slot. Run before the slot-layout
          # gate below trusts its output for anything.
          python3 tests/signing-slots.py --selftest
      # Static, checkout-only and PyYAML-only, so it rides along with the gate
      # above — which is also where PyYAML is installed, so this step must stay
      # after it. What it guards is the release path itself: release.yml publishes
      # by hand now, and the invariant that matters — an incomplete release is
      # never published, and a complete one never left a draft — has no other
      # check. Its failure is silent, which is exactly how v16.57.1 shipped to
      # nobody. `--selftest` first, same reasoning as above: it mutates the
      # completeness gate out of the script and asserts the suite goes red.
      - name: Release publish script holds its invariants
        run: |
          python3 tests/validate-release-publish.py --selftest
          python3 tests/validate-release-publish.py
      # Same reasoning: static, checkout-only, and the thing it guards (one
      # favicon inlined into five files across three languages) has no compiler
      # or linter that can see the drift.
      - name: Favicon matches on every surface
        run: |
          chmod +x tests/validate-favicon.sh
          ./tests/validate-favicon.sh
      # Same again: `.topbar.electron`'s height and desktop/src/main.js's
      # TOPBAR_HEIGHT are the same number in two languages, tied together only by
      # this gate. `TOPBAR_HEIGHT` has one consumer (the traffic-light `y`), so
      # drift stays green everywhere and ships as OS window buttons sitting off
      # the bar they are supposed to be centred in.
      - name: Electron top bar height matches the shell constant
        run: |
          chmod +x tests/validate-topbar-height.sh
          ./tests/validate-topbar-height.sh
      # The macOS half of the signing smoke test (issue #339) has exactly one
      # executing home: the `signing-smoke` job. Its ad-hoc-resign case is
      # `#[cfg(target_os = "macos")]`, and `signing-smoke` is the only job in
      # this workflow that runs `cargo test` on macOS — `integration`,
      # `injection-test` and `release-build`'s darwin legs are Rust jobs on
      # macOS too, but they build and run the CLI rather than the test suite.
      # So deleting or renaming `signing-smoke` leaves CI fully green with zero
      # coverage of the ordering install.sh's re-sign depends on — a silent
      # reopening of the exact gap this issue closed. Nothing else notices:
      # `validate-workflow-gates.py` reads jobs only to check their draft guard,
      # never that a given job exists.
      # Structural rather than grep: `grep runs-on: macos-latest` over the whole
      # file passes on `integration` and `injection-test` too, so it would stay
      # green with `signing-smoke` deleted — a gate that cannot fail.
      - name: The macOS signing smoke job still exists
        run: |
          python3 - <<'PY'
          import pathlib, re, sys, yaml
          ci = yaml.safe_load(open(".github/workflows/ci.yml"))
          job = ci["jobs"].get("signing-smoke")
          if job is None:
              sys.exit("ci.yml: the `signing-smoke` job is gone; the macOS "
                       "ad-hoc-resign test has no other executing home (issue #339)")
          if job.get("runs-on") != "macos-latest":
              sys.exit(f"ci.yml: signing-smoke runs on {job.get('runs-on')!r}; the "
                       "test it exists for is #[cfg(target_os = \"macos\")]")
          runs = " ".join(str(s.get("run", "")) for s in job["steps"])
          if "cargo test -p veld-sign" not in runs:
              sys.exit("ci.yml: signing-smoke no longer runs `cargo test -p veld-sign`")
          smoke = open("crates/veld-sign/tests/smoke.rs").read()
          if "fn adhoc_resign_after_ed25519_signing_is_byte_idempotent" not in smoke:
              sys.exit("crates/veld-sign/tests/smoke.rs: the ad-hoc resign "
                       "idempotency test is gone; install.sh's re-sign assumption "
                       "would be unverified again (issue #339)")
          # A name-only check would still pass with the case marked `#[ignore]`,
          # which is the normal reaction to a flake and leaves the ordering
          # unexercised with every check green.
          if "#[ignore]" in smoke:
              sys.exit("crates/veld-sign/tests/smoke.rs: an #[ignore] here means a "
                       "signing case silently stops running; delete the test or fix "
                       "it rather than skipping it (issue #339)")

          # No job that a pull request can start may reach ANY org signing
          # secret. Checking every workflow, and checking the *guard* rather than
          # the filename, because release.yml is itself `pull_request`-triggered
          # (it previews the next version on a PR) — the only thing keeping the
          # key off those runs is the `push`-only `if:` on its `build` job, and
          # exempting the file by name would leave exactly that guard unchecked.
          #
          # Derived for N secrets rather than for the one that existed when this
          # was written (issue #261 slice C). A key rotation adds a second private
          # key under a second secret name, and an assertion pinned to one literal
          # name would go quiet for the new one — the moment the check is needed
          # most, since a fresh secret is exactly what a half-finished workflow
          # edit exposes. So the shared prefix is matched as well as the exact
          # name, and both are assembled at runtime for the reason below.
          #
          # Walking the parsed YAML rather than grepping means the comments above
          # — which do name the secret — are already gone, and dict keys are
          # walked too, so naming it as a bare `env:` key is caught as well.
          # Two forms never spell the name and so must be refused by shape: a
          # bulk reference to the whole secrets context, and a dynamic index into
          # it. Neither has a legitimate use here.
          #
          # All three needles are assembled at runtime so this check cannot match
          # itself: its own `run:` block is a string in the very documents it
          # walks. (Writing them literally made the gate fail on a clean tree —
          # once per needle.)
          secret = "SIGN" + "ING_" + "PRIVATE_KEY"
          # Every signing secret shares this prefix by convention, which is what
          # makes "N secrets" checkable without listing them. Nothing else in
          # these workflows uses it: the smoke test's throwaway key is
          # VELD_SIGN_SMOKE_KEY, which has no underscore in that position.
          #
          # Assembled at runtime for a reason that now covers more ground than the
          # exact name did: a `run:` block's COMMENTS are part of its string, so no
          # step in this job may contain the prefix in prose either. Naming the
          # keyring constant in a comment two steps down was enough to fail a
          # clean tree — which is the gate working, and is why the constants are
          # referred to by file rather than by name below.
          secret_prefix = "SIGN" + "ING_"
          bulk_ref = "toJSON(" + "secrets)"
          dynamic_ref = "secrets" + "["
          def strings(node):
              if isinstance(node, dict):
                  for k, v in node.items():
                      yield from strings(k)
                      yield from strings(v)
              elif isinstance(node, list):
                  for v in node:
                      yield from strings(v)
              elif isinstance(node, str):
                  yield node
          def uses_secret(node):
              for s in strings(node):
                  packed = s.replace(" ", "")
                  if secret in s:
                      return secret
                  # Any other secret under the same prefix — a rotation's second
                  # key, or a third. Reported without naming it, because the name
                  # is the thing this file must not contain.
                  if secret_prefix in s:
                      return "a signing secret"
                  if bulk_ref in packed:
                      return "the whole secrets context"
                  if dynamic_ref in packed:
                      return "a dynamic index into the secrets context"
              return None
          # `on:` parses as the boolean True under YAML 1.1, so accept both keys.
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              doc = yaml.safe_load(path.read_text())
              triggers = doc.get("on", doc.get(True)) or {}
              if isinstance(triggers, str):
                  triggers = {triggers: None}
              if isinstance(triggers, list):
                  triggers = dict.fromkeys(triggers)
              # `workflow_call` counts as PR-reachable: a reusable workflow
              # never carries `pull_request` in its own `on:`, but a caller that
              # does can invoke it, so judging it by its own triggers alone is a
              # blind spot rather than an exemption.
              pr_triggered = any(
                  t in triggers
                  for t in ("pull_request", "pull_request_target", "workflow_call")
              )
              for job_name, job in (doc.get("jobs") or {}).items():
                  what = uses_secret(job)
                  # `secrets: inherit` hands the callee every secret this repo
                  # has without naming one, so it reaches the signing key just
                  # as surely as spelling it out.
                  if what is None and str(job.get("secrets", "")).strip() == "inherit":
                      what = "every secret, via `secrets: inherit`"
                  if what is None:
                      continue
                  # Quote style is not meaning: `== 'push'` and `== "push"` are
                  # the same guard, and matching only one spelling would fail a
                  # legitimate reformat of release.yml.
                  guard = str(job.get("if", "")).replace(" ", "").replace('"', "'")
                  push_only = "github.event_name=='push'" in guard
                  if pr_triggered and not push_only:
                      sys.exit(
                          f"{path}: job {job_name!r} references {what}, but a "
                          "pull request can start that workflow and the job is "
                          "not guarded `github.event_name == 'push'`. The signing "
                          "key must never be reachable from a PR run (issue #339)"
                      )
          # No secret may be interpolated into a `run:` block. Two separate
          # reasons, and the second one cost a blocked CI run to learn.
          #
          # The security one: a secret expanded into a shell command lands in the
          # process table and in any `set -x` trace, where `env:` does not. The
          # correct channel is an `env:` entry, which is what release.yml uses.
          #
          # The mechanical one: GitHub evaluates `${…}` expressions in a `run:`
          # block BEFORE the shell sees it, so a *mention* of the syntax — in a
          # comment, in a hint string, in a Python literal inside a heredoc — is
          # evaluated as an expression. An invalid one fails the **whole workflow at
          # startup**: zero jobs, conclusion `failure`, no usable error. PyYAML
          # accepts it, `just workflow-gates` accepts it, and every local check
          # stays green, which is exactly what happened here. Describe the remedy in
          # prose instead.
          #
          # Assembled at runtime like the needles above, for the same reason: this
          # block is a string in the documents it walks.
          # Two checks, because the second is the general form of the first.
          #
          # The regexes are written with escapes (`\$\{\{`), which is not only
          # because a regex needs them: it also means this block does not contain the
          # syntax literally, so the gate cannot fail on itself. That is not
          # hypothetical — it happened, twice.
          secret_in_run = "${" + "{ secrets."
          expr_in_run = re.compile(r"\$\{\{(.*?)\}\}", re.S)
          # What a real expression looks like: a context path, an index, a function
          # call. Deliberately generous — the point is to catch PROSE, not to
          # validate GitHub's grammar.
          plausible = re.compile(r"[A-Za-z_][\w.\-\[\]'\"* ]*\Z")
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              doc = yaml.safe_load(path.read_text())
              for job_name, job in (doc.get("jobs") or {}).items():
                  for step in (job.get("steps") or []):
                      body = step.get("run")
                      if not isinstance(body, str):
                          continue
                      where = f"{path}: job {job_name!r} step {step.get('name')!r}"
                      if secret_in_run in body:
                          sys.exit(
                              f"{where} names a secret inside its `run:` block. Pass it "
                              "through the step's `env:` instead — a secret interpolated into "
                              "a shell command reaches the process table and any trace, where "
                              "an `env:` entry does not."
                          )
                      for m in expr_in_run.finditer(body):
                          expr = m.group(1).strip()
                          if not plausible.match(expr):
                              sys.exit(
                                  f"{where} contains what GitHub will read as an EXPRESSION "
                                  f"but is not one: {expr[:60]!r}. Actions evaluates these in "
                                  "a `run:` block before the shell sees it — including inside "
                                  "a comment or a string literal — and an invalid one fails "
                                  "the WHOLE WORKFLOW at startup: zero jobs, conclusion "
                                  "`failure`, no usable error, and every local check green. "
                                  "If you are describing the syntax rather than using it, "
                                  "describe it in prose."
                              )

          # The version-record guard in `release.yml`'s packaging step (issue
          # #262) has the same "gate that cannot fail" problem `signing-smoke`
          # has: nothing else in CI notices if it is deleted, and what it
          # prevents is a release carrying a helper with no version inside it —
          # an artifact NO privileged install can ever update onto, whose only
          # repair is asking every user for sudo.
          release = yaml.safe_load(open(".github/workflows/release.yml"))
          pkg = [
              step
              for job in release["jobs"].values()
              for step in (job.get("steps") or [])
              if step.get("name") == "Package client binaries"
          ]
          if not pkg:
              sys.exit("release.yml: the `Package client binaries` step is gone; the "
                       "helper version-record check went with it")
          if "veld-helper version record" not in pkg[0].get("run", ""):
              sys.exit("release.yml: `Package client binaries` no longer checks that the "
                       "shipped helper carries a version record. Without it a release can "
                       "ship a helper no privileged install can update onto.")

          print("signing-smoke intact")
          print("release.yml version-record check intact")
          PY

      # ── Key-rotation gates (issue #261 slice C) ──────────────────────────
      #
      # Everything below pins a fact that lives in TWO files with no compiler
      # tie between them, where the drift is silent and the symptom is a release
      # no privileged install can accept — repairable only with sudo on every
      # machine, which is the one outcome #338's rules forbid.
      #
      # It is homed here for the same reason the checks above are: `release.yml`'s
      # `build` job is push-only, so nothing it contains is ever exercised by a
      # pull request. This is the PR-time equivalent.
      - name: Signature slot layout matches release.yml
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys, yaml

          signing = pathlib.Path("crates/veld-core/src/signing.rs").read_text()

          def rust_const(name, text, path):
              m = re.search(rf"const {name}: usize = (\d+);", text)
              if not m:
                  sys.exit(f"{path}: `{name}` is gone; the slot-layout gates in "
                           "ci.yml read it (issue #261 slice C)")
              return int(m.group(1))

          # The signature format's slot ceiling, and therefore the size of the
          # permanent secret roster in release.yml. `RELEASE_SIG_SLOTS` is no longer
          # read here: it is `ORG_KEYS.len()` now, so a number in this file would be
          # a third copy of something the table already says.
          slots_ceiling = rust_const(
              "MAX_SIG_SLOTS", signing, "crates/veld-core/src/signing.rs"
          )

          release = yaml.safe_load(open(".github/workflows/release.yml"))
          pkg = [
              step
              for job in release["jobs"].values()
              for step in (job.get("steps") or [])
              if step.get("name") == "Package client binaries"
          ]
          if not pkg:
              sys.exit("release.yml: the `Package client binaries` step is gone, and "
                       "with it the only place the helper is ever signed")
          run = pkg[0].get("run", "")
          # Comment lines are part of a `run:` block's string and this step's own
          # prose names the flags, so they are stripped before counting. Counting
          # them would silently inflate the number and make this gate unfailable.
          command = "\n".join(
              line for line in run.splitlines() if not line.strip().startswith("#")
          )

          # 1. Every key the source names has a secret this step can read.
          #
          #    `release.yml` no longer carries a key list at all: it derives the
          #    whole slot layout from `ORG_KEYS` with `tests/signing-slots.py`, so
          #    rotating needs no edit to that file. What still needs one — once,
          #    ever — is the `env:` roster, because GitHub only exposes a secret to
          #    a step that names it, and a workflow cannot enumerate secrets (the
          #    leak gate above forbids the two ways of trying).
          #
          #    So the failure this replaces is unchanged in kind and better aimed:
          #    it used to be "a `--key-env` with no `env:` entry", which was the
          #    workflow checked against itself. It is now the SOURCE checked against
          #    the workflow. veld-sign reads a key by variable NAME, so a name with
          #    no `env:` entry is indistinguishable from an unset secret — and the
          #    release dies at a push-only step, i.e. after merge.
          rows = json.loads(
              subprocess.run(
                  [sys.executable, "tests/signing-slots.py", "--json"],
                  capture_output=True, text=True, check=False,
              ).stdout
              or "[]"
          )
          if not rows:
              # The script exits non-zero with its own message for every table it
              # will not guess about; re-run it so that message is what CI prints,
              # rather than this gate reporting an empty list as "no keys".
              subprocess.run([sys.executable, "tests/signing-slots.py"], check=True)
              sys.exit("tests/signing-slots.py produced no rows and did not say why")

          env_keys = set((pkg[0].get("env") or {}).keys())
          for row in rows:
              if row["secret"] not in env_keys:
                  # The remedy is described in prose on purpose, and the reason is
                  # worth stating without demonstrating it: GitHub's expression
                  # syntax, written out in a `run:` block, is EVALUATED before the
                  # shell sees it — even inside a comment or a string literal like
                  # this one. An invalid expression fails the whole workflow at
                  # startup: zero jobs, conclusion `failure`, no usable error.
                  # PyYAML parses it happily, `just workflow-gates` parses it
                  # happily, and every local check stays green. This comment cost
                  # two blocked CI runs to get right, the second because it
                  # quoted the syntax while explaining not to.
                  sys.exit(
                      f"crates/veld-core/src/signing.rs: ORG_KEYS row {row['index']} names the "
                      f"secret {row['secret']}, but `Package client binaries` has no {row['secret']} "
                      "entry in its `env:` block — so veld-sign would see an unset variable and the "
                      "release would fail at the signing step, which is push-only and therefore "
                      f"after merge. Add a {row['secret']} entry to that step's env:, taking its "
                      "value from the secret of the same name the way the existing lines do."
                  )

          # 2. The roster covers every slot the format allows, so a rotation never
          #    has to touch `release.yml` at all.
          #
          #    Gate 1 above would catch a key with no `env:` entry — but it would
          #    catch it as an edit the operator still has to make, which is the
          #    thing this whole design removed. The roster is written once, to the
          #    ceiling, and pinned here so it cannot be trimmed back to "just what
          #    we use today" by someone tidying.
          #
          #    A name whose secret is unset costs nothing: it is an environment
          #    variable that is not there, and veld-sign never asks for it unless
          #    ORG_KEYS names it.
          roster = ["SIGN" + "ING_PRIVATE_KEY"] + [
              "SIGN" + f"ING_PRIVATE_KEY_{n}" for n in range(2, slots_ceiling + 1)
          ]
          # And each roster entry must take its value from the secret of the SAME
          # name. Binding the second roster entry to the FIRST key's secret is a
          # plausible copy-paste when the roster is written (the two names differ by
          # one character, and this comment cannot spell either of them out: the
          # leak gate above matches the shared prefix across every string in a
          # PR-startable job, and found this line the first time it was written).
          # It passes the presence check
          # above, and the expected-key half of `--slots` then catches it — but at
          # the push-only signing step, after merge, which is precisely the failure
          # this job exists to move to pull-request time. The reference is matched
          # by shape rather than quoted, because GitHub evaluates its expression
          # syntax inside a `run:` block before the shell sees it — including in a
          # comment or a string literal — and an invalid one fails the whole
          # workflow at startup with zero jobs and no usable error.
          #
          #    Matched whole, not as a substring. Every roster name is a **prefix**
          #    of the ones after it by construction, so a substring test accepts
          #    slot 0 bound to a later slot's secret — and that is the fatal
          #    direction: slot 0 signed by any other key is a release NO shipped
          #    helper can relaunch onto. Built from the roster variable so this
          #    block contains no signing-secret name for the leak gate to hit.
          env_block = pkg[0].get("env") or {}
          for name in roster:
              value = str(env_block.get(name, ""))
              wanted = re.compile(r"\$\{\{\s*secrets\." + re.escape(name) + r"\s*\}\}")
              if name in env_block and not wanted.fullmatch(value.strip()):
                  sys.exit(
                      f"release.yml: `Package client binaries` sets {name} from something "
                      f"other than the {name} secret. Every roster entry must read the "
                      "secret of its own name — a slot signed by another slot's key ships "
                      "a release no installed helper can relaunch onto, and the check that "
                      "catches it runs at the push-only signing step, after merge."
                  )
          missing = [n for n in roster if n not in env_keys]
          if missing:
              sys.exit(
                  f"release.yml: `Package client binaries` env: is missing {len(missing)} of the "
                  f"{len(roster)} permanent signing-secret names (first: {missing[0]}). That block "
                  "is written once to the signature format's slot ceiling and never edited again — "
                  "it is what makes rotating a key a source edit plus a new secret, with no "
                  "workflow change. See docs/signing-key-rotation.md."
              )

          # 3. The step really does derive the layout, and still checks it.
          #
          #    This is the gate with the most to lose, because what it protects is
          #    now invisible in `release.yml`: there is no key list there to read.
          #    Deleting the derivation and hard-coding something would look tidier
          #    and would silently reintroduce every failure the element-wise check
          #    used to catch — above all a signing secret holding a *different but
          #    valid* key, which parses, signs, and publishes a release no helper in
          #    the field can relaunch onto.
          #
          #    `--slots` is what carries the expected public key for EVERY slot, not
          #    just slot 0: a wrong key in a later slot ships invisibly (the release
          #    still installs everywhere via slot 0) and then wedges every privileged
          #    install one release later, when that key becomes the only one a helper
          #    accepts. Fleet-wide, sudo-only, which is the one outcome #338 forbids.
          for needle, why in [
              ("tests/signing-slots.py",
               "the slot layout would stop coming from crates/veld-core/src/signing.rs, "
               "which is the reviewed source the helper's own keyring is compiled from"),
              ("--slots",
               "veld-sign would be given no expected public key per slot, and a secret "
               "holding a different valid key would ship a release no installed helper "
               "can relaunch onto"),
          ]:
              if needle not in command:
                  sys.exit(
                      f"release.yml: `Package client binaries` no longer passes `{needle}` — {why} "
                      "(issue #261 slice C). Read docs/signing-key-rotation.md before changing how "
                      "that step signs."
                  )
          #    And the flags `--slots` replaced must NOT come back. Adding a
          #    `--key-env` line is the old runbook's reflex and the first thing an
          #    operator reaches for; veld-sign refuses the mix and writes no
          #    signature, but it refuses at the push-only signing step, after merge.
          for banned, why in [
              ("--key-env",
               "the slot layout comes from ORG_KEYS now; a key flag here is the old "
               "procedure's reflex and veld-sign refuses it, but only at release time"),
              ("--expect-slot-pubkeys",
               "--slots already carries the expected key for every slot, and veld-sign "
               "refuses both together"),
          ]:
              if banned in command:
                  sys.exit(
                      f"release.yml: `Package client binaries` passes `{banned}` alongside "
                      f"`--slots`, which veld-sign refuses — {why}. Rotating a key needs NO edit "
                      "to this file: append a row to ORG_KEYS in "
                      "crates/veld-core/src/signing.rs and set the matching secret. See "
                      "docs/signing-key-rotation.md."
                  )
          # **What is deliberately NOT checked here**, so nobody adds it back thinking
          # it does something: comparing the script's `--slots` output against its own
          # `--json` output. Both come from the same parse, so a parse that drops a row
          # drops it identically on both sides — it reads like a cross-check and pins
          # nothing. The parse is a *second implementation* of a value rustc already
          # has, and the only thing that can catch it diverging is a comparison against
          # the compiler: `the_slot_script_reads_the_same_table_the_compiler_does` in
          # `crates/veld-core/src/signing.rs`, which runs in `cargo test --workspace`.
          # Gate 6 below pins that test's existence.


          # 4. veld-sign's own slot ceiling. It deliberately does not depend on
          #    veld-core outside its tests (it must build fast for the host while
          #    the release build cross-compiles), so the number is duplicated and
          #    this is what stops the copy rotting. A ceiling above the reader's
          #    would write slots no helper ever looks at.
          sign_main = pathlib.Path("crates/veld-sign/src/main.rs").read_text()
          if rust_const("MAX_SLOTS", sign_main, "crates/veld-sign/src/main.rs") != slots_ceiling:
              sys.exit(
                  "veld-sign's MAX_SLOTS and veld_core::signing::MAX_SIG_SLOTS disagree. "
                  "The signer would write slots the reader never reads."
              )
          #    `tests/signing-slots.py` carries a third copy, and it was the one with
          #    no gate: raise MAX_SIG_SLOTS and everything stays green until somebody
          #    appends the 9th row, which then fails with "no reader looks past slot
          #    7" and tells them to raise a constant they already raised.
          script_ceiling = re.search(
              r"^MAX_SLOTS = (\d+)$", pathlib.Path("tests/signing-slots.py").read_text(), re.M
          )
          if not script_ceiling:
              sys.exit("tests/signing-slots.py: `MAX_SLOTS` is gone; this gate reads it")
          if int(script_ceiling.group(1)) != slots_ceiling:
              sys.exit(
                  f"tests/signing-slots.py's MAX_SLOTS ({script_ceiling.group(1)}) and "
                  f"veld_core::signing::MAX_SIG_SLOTS ({slots_ceiling}) disagree. The script "
                  "would refuse a table the readers accept, or accept one they do not."
              )

          # 5. The rotation format runs in production exactly once, on the worst
          #    day, and `release.yml`'s signing step is push-only — so these tests
          #    are its only exercise before it is needed. The macOS one has a
          #    single executing home (`signing-smoke`), the same reason the
          #    ad-hoc-resign case is pinned above.
          smoke = pathlib.Path("crates/veld-sign/tests/smoke.rs").read_text()
          for name, why in [
              ("several_keys_write_one_slot_each_in_order",
               "nothing else checks that the flag order is the slot order"),
              ("a_pre_rotation_reader_accepts_a_multi_slot_signature",
               "this is the only check that an already-shipped helper still accepts a "
               "rotation release"),
              ("a_bad_key_in_a_later_slot_writes_no_signature_at_all",
               "without it a failed rotation can leave a partial .sig that verifies for "
               "one generation and no other"),
              ("an_unexpected_key_in_any_slot_is_refused_and_the_expected_value_is_not_echoed",
               "this covers the wrong-secret guard for EVERY slot, its count check, and its "
               "no-echo rule; a slot-0-only version of it missed the fleet-fatal case"),
              ("a_malformed_expected_pubkey_blames_the_flag_not_the_secret",
               "without it a bad flag is reported as a wrong signing secret, which is where "
               "somebody looks first on a failed release"),
              ("no_key_material_from_any_slot_reaches_stderr",
               "a second key doubles the surface #339 found the leaks in; veld-sign's "
               "module doc enumerates them"),
              ("the_same_key_in_two_slots_is_refused_without_naming_it",
               "the runbook and veld-sign's own usage text both state this guarantee"),
              ("more_keys_than_slots_is_a_usage_error",
               "without it a release can claim more slots than any reader looks at"),
              ("adhoc_resign_is_byte_idempotent_for_a_multi_slot_signature",
               "install.sh's macOS re-sign is unverified for the multi-slot shape "
               "otherwise, and this is the only macOS home for it"),
              ("slots_is_the_same_signature_as_key_env_plus_expected_pubkeys",
               "--slots is the flag the release actually uses, and every other guard in "
               "that file is written against the spelling it stands for; without this "
               "equivalence none of them cover the path that ships"),
              ("a_slots_entry_whose_secret_holds_another_key_is_refused",
               "the wrong-secret guard reached through the release path, which is the "
               "only path a release takes"),
              ("slots_and_expect_slot_pubkeys_together_is_refused",
               "a step passing both is a half-finished edit, and letting one silently win "
               "is how a slot ends up checked against the wrong key"),
          ]:
              if f"fn {name}" not in smoke:
                  sys.exit(f"crates/veld-sign/tests/smoke.rs: `{name}` is gone — {why} "
                           "(issue #261 slice C)")

          # 6. The invariants a rotation must NOT delete.
          #
          #    `signing.rs` used to carry two TRIPWIRES that went red for a *correct*
          #    rotation and whose own docs told the operator to delete them. That
          #    made step 2 of a rotation "delete a red test", rehearsed on the worst
          #    day available, beside permanent invariants that look identical when
          #    the whole file is red. Both are gone: one was restated as a relation
          #    that holds before and after every rotation
          #    (`the_artifact_carries_exactly_one_slot_per_key`), and the other was
          #    replaced by tests that go red when a retirement is *unsafe* rather
          #    than whenever one happens
          #    (`one_release_never_both_adds_a_key_and_retires_one` and the two
          #    invariants that keep its dates honest).
          #
          #    **Nothing in this list is ever deleted by a rotation.** That is the
          #    whole content of the list now, and it is a stronger statement than the
          #    one it replaces: if a test in `signing.rs` is red, the answer is never
          #    to delete it.
          invariants = pathlib.Path("crates/veld-core/src/signing.rs").read_text()
          for name, why in [
              ("a_one_key_signature_is_exactly_64_bytes",
               "the format claim a pre-rotation reader depends on: one key is still "
               "exactly the 64 bytes that shipped before slots existed"),
              ("the_artifact_carries_exactly_one_slot_per_key",
               "the writer must emit one slot per ORG_KEYS row with no padding and no "
               "holes; slot position is this format's only key identifier"),
              ("one_release_never_both_adds_a_key_and_retires_one",
               "this is the two-release rule itself — the only thing that fails a pull "
               "request which both adds a key and retires one, which was unguarded "
               "before it and is the mistake this whole runbook repeats most"),
              ("the_slot_script_reads_the_same_table_the_compiler_does",
               "tests/signing-slots.py is a second implementation of ORG_KEYS, read by "
               "both workflows; this is the only comparison against what rustc actually "
               "compiles, and a row the script misses is a slot the release omits"),
              ("added_after_increases_down_the_table",
               "without it the two-release guard is defeated by pasting row 0's 0.0.0 or "
               "the previous row's version into a new row"),
              ("every_secret_name_is_one_of_the_permanent_roster",
               "a name outside the roster turns rotating back into a release.yml edit, "
               "which is the whole thing this design removed"),
              ("every_key_lifecycle_date_names_a_release_that_has_happened",
               "the rule above is only as good as its two dates: a value newer than this "
               "tree is somebody guessing at the version their merge will ship as, which "
               "is the combined edit wearing a disguise"),
              # The keyring constant is referred to by description rather than by
              # name here, and that is not squeamishness: its name contains the
              # signing-secret prefix as a substring, so the leak gate above — which
              # matches that prefix across every string in a PR-startable job —
              # fails this whole workflow if it is spelled out. Found by the gate
              # itself while this list was being written.
              ("the_derived_views_match_the_table",
               "the keyring, the required-slot list and the slot count are const-fn "
               "views of ORG_KEYS; one that quietly dropped a row would compile and "
               "ship a release signed by a key no reader expects"),
              ("no_key_and_no_secret_appears_twice",
               "two rows sharing a secret means one slot is signed by the other row's "
               "key — the invisible mis-pairing the secret field exists to prevent"),
              ("every_secret_name_carries_the_signing_prefix",
               "the leak gate in this job matches that prefix to prove no "
               "pull-request-startable job can reach a signing secret"),
              ("the_keyring_is_never_empty",
               "without it, a retirement performed without its matching addition ships a "
               "helper that trusts nothing and leaves sudo as the only repair"),
              ("every_accepted_key_is_one_releases_are_signed_by",
               "without it, a key in the keyring but not in the required-slot list makes "
               "this build refuse every release"),
              ("org_key_1_holds_slot_zero_forever",
               "slot 0 is the compatibility contract with every already-shipped helper"),
              ("the_pre_rotation_reader_still_accepts_a_multi_slot_release",
               "the only check that an already-shipped helper accepts a rotation release"),
              ("a_binary_past_the_bound_is_refused_not_verified_as_a_prefix",
               "the binary read was unbounded on a path an unprivileged caller can "
               "influence, and verifying a prefix verifies nothing"),
              ("a_binary_symlinked_to_a_non_regular_file_is_refused",
               "root follows a user-planted symlink here, and `shutdown` reaches the "
               "relaunch guard with no executability check in front of it"),
              ("a_torn_signature_is_retried_but_an_unreadable_one_is_not",
               "install.sh writes the lib-dir .sig with `cp`, so a torn read is real; "
               "classifying it as unreadable printed a tampering paragraph on a healthy "
               "machine"),
              ("an_over_bound_binary_is_refused_once_and_not_retried",
               "the over-bound arm has no other seam, and deleting it would verify the "
               "binary as a prefix with every test still green"),
              ("only_a_verification_failure_is_retried",
               "the retry scoping changes no verdict, only the number of reads, so nothing "
               "else would notice it being widened back to every refusal"),
              ("each_distinct_slot_is_verified_at_most_once",
               "the slot dedupe changes no verdict, so nothing else would notice it being "
               "simplified away"),
          ]:
              if f"fn {name}" not in invariants:
                  sys.exit(f"crates/veld-core/src/signing.rs: `{name}` is gone — {why}. A "
                           "rotation deletes no test at all any more: if one here is red, the "
                           "answer is never to delete it. See docs/signing-key-rotation.md.")

          print(
              f"signature slots: {len(rows)} of at most {slots_ceiling}; slot 0 pinned to "
              "ORG_KEY_1; roster and rotation smoke tests intact"
          )
          print("signing.rs rotation invariants intact")
          PY

      # `install.sh` is the largest program in this repo that nothing checked.
      # It is what `curl | bash` runs, what `veld update` runs, and now what
      # Veld Desktop's own updater ends up in — and until this step it was
      # possible to ship it with a syntax error, because no test executes it and
      # no linter reads it. `--severity=warning` is where the file sits clean
      # today; the remaining `info` diagnostics are deliberate (`sudo` with a
      # `/dev/tty` redirect is the point of that line).
      # ── The two-release rule, at the level it actually lives on ────────
      #
      # `one_release_never_both_adds_a_key_and_retires_one` in
      # `crates/veld-core/src/signing.rs` catches the combined edit whenever both
      # halves were written against the same release, which is the common shape
      # and costs nothing — it runs in `cargo test --workspace`, locally and on a
      # direct push to main, with no git and no network.
      #
      # **It has one hole, and this step is that hole's patch.** A branch whose
      # `Cargo.toml` moves between the two edits — an unrelated release lands, the
      # operator updates the branch, then retires — records two dates that are both
      # *honest* and *different*. Neither equals the current version, so the static
      # test sees no combined edit, and the release strands every helper whose only
      # key was the retired one. The tree genuinely cannot tell "added last release"
      # from "added in this pull request"; only the diff can.
      #
      # So this is deliberately the one piece of the schema job that reads git
      # rather than the tree. It needs no fetch and no ref from the event payload:
      # on a pull request `actions/checkout` checks out the **merge commit**
      # (`refs/pull/N/merge`), whose first parent is the base branch tip GitHub
      # merged against and whose second is the pull request's head. So
      # `git diff HEAD^1 HEAD` is exactly this pull request's contribution — the
      # job's checkout carries `fetch-depth: 2` for it, one extra commit.
      #
      # Deliberately not `github.event.pull_request.base.sha`: that value is the
      # base as of the event, and it goes stale when the base branch moves without
      # the pull request being synchronised — which here means an intervening
      # release, i.e. precisely the situation this step exists for. A stale base
      # would fold somebody else's merged rotation into this diff and fail an
      # innocent pull request. `HEAD^1` is whatever GitHub actually merged against,
      # recomputed for every run.
      #
      # Scoped to `pull_request`, because on a push there is no merge commit and no
      # such thing as "this pull request's diff". The unit test in `signing.rs` is
      # what still covers a direct push to main.
      - name: One release never both adds a key and retires one
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          import importlib.util, subprocess, sys

          # The table is compared **parsed**, not as diff text. Matching added lines
          # for `OrgKey {` and `KeyStatus::Retired` was the first version and it is
          # wrong in both directions: it fires on any pull request that merely
          # mentions the variant in a comment or a test (it fired on the one that
          # introduced this file), and it would miss a row edited into a shape the
          # regex does not recognise. Reusing the parser both workflows already read
          # the table with means this gate sees exactly what a release will sign.
          spec = importlib.util.spec_from_file_location("slots", "tests/signing-slots.py")
          slots = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(slots)

          path = "crates/veld-core/src/signing.rs"

          def table(ref):
              got = subprocess.run(
                  ["git", "show", f"{ref}:{path}"], capture_output=True, text=True
              )
              if got.returncode != 0:
                  return None
              try:
                  return slots.parse(got.stdout)
              except slots.TableError:
                  return None

          # `HEAD^1` is the base GitHub merged against; `HEAD` is the merge result.
          before, after = table("HEAD^1"), table("HEAD")
          if after is None:
              sys.exit(
                  f"{path}: the key table in this pull request cannot be read. "
                  "`python3 tests/signing-slots.py` says why, and a table the release "
                  "cannot read is a release that signs nothing."
              )
          if before is None:
              # One-time, and loud rather than silent: the base has no readable table,
              # so this change introduces or restructures the table itself. There is no
              # before-and-after to compare, and a change of that shape is one a human
              # reads anyway.
              print(
                  f"{path}: the base has no readable ORG_KEYS, so this change introduces "
                  "or restructures the table rather than rotating a key. Nothing to "
                  "compare."
              )
              raise SystemExit(0)

          was = {r["pubkey"]: r["status"] for r in before}
          now = {r["pubkey"]: r["status"] for r in after}
          added = sorted(k for k in now if k not in was)
          retired = sorted(k for k in now if was.get(k) == "accepted" and now[k] == "retired")
          dropped = sorted(k for k in was if k not in now)

          def short(keys):
              return ", ".join(k[:8] + "\u2026" for k in keys)

          # A row that left the table stops producing its slot, which strands every
          # helper generation that accepts only that key. Nothing else in the repo can
          # see it: removing a row destroys the evidence it was ever there, which is
          # the same shape as the combined edit below.
          if dropped:
              sys.exit(
                  f"{path}: this pull request REMOVES {len(dropped)} row(s) from ORG_KEYS "
                  f"({short(dropped)}). Rows are append-only: a row that leaves stops "
                  "producing its slot, and every helper generation whose keyring holds only "
                  "that key then refuses every future release, sudo-only. Retiring a key "
                  "changes its `status` and keeps the row. Dropping one is the announced "
                  "flag day in docs/signing-key-rotation.md, not something a rotation does."
              )
          if added and retired:
              sys.exit(
                  f"{path}: this pull request both adds a key ({short(added)}) and retires "
                  f"one ({short(retired)}). Merging is releasing here, so that is ONE release "
                  "doing both — and every helper whose only key is the retired one then "
                  "refuses the very artifact meant to move it forward, with sudo on every "
                  "machine as the only repair.\n\n"
                  "Split it: ship the adding release first, wait for it to reach the fleet, "
                  "then retire in a second pull request. See docs/signing-key-rotation.md."
              )
          print(f"{path}: {len(added)} key(s) added, {len(retired)} retired — not both")
          PY

      - name: Shell scripts parse and lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          bash -n tests/validate-install-contract.sh
          shellcheck --severity=warning install.sh tests/validate-install-contract.sh scripts/dev/*.sh
      # The drift neither of the above can see: a `VELD_*` variable renamed on
      # one side of the CLI/install.sh boundary. Both files stay individually
      # valid while every app update silently reinstalls the CLI and restarts
      # the daemon. Runs the script's two pre-network refusal paths, so it needs
      # no macOS and downloads nothing.
      - name: CLI and install.sh agree on their contract
        run: |
          chmod +x tests/validate-install-contract.sh
          ./tests/validate-install-contract.sh

  licenses:
    permissions:
      contents: read
    name: Third-Party Licenses
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      # Prebuilt cargo-about binary (fast; `cargo install` would compile ~150 deps).
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          # Pin the version — output formatting can change between releases,
          # which would make the drift diff flaky. Bump in lockstep with the
          # version used to regenerate THIRD-PARTY-LICENSES.md locally.
          tool: cargo-about@0.9.1
      # Regenerate the attribution file and fail if the committed copy is stale.
      # Resolution is target-pinned in about.toml, so the output does not depend
      # on which OS runs this — the diff is deterministic against Cargo.lock.
      - name: Verify THIRD-PARTY-LICENSES.md is current
        run: |
          # tr -d '\r' matches `just licenses` — some upstream license texts
          # carry CRLF; normalizing keeps the diff byte-stable (see justfile).
          cargo about generate about.hbs | tr -d '\r' > THIRD-PARTY-LICENSES.check.md
          if ! diff -u THIRD-PARTY-LICENSES.md THIRD-PARTY-LICENSES.check.md; then
            echo "::error::THIRD-PARTY-LICENSES.md is out of date — run 'just licenses' and commit the result."
            exit 1
          fi
          echo "Third-party license attribution is up to date."

  # ── Dependency audit — known-vulnerability gate ────────────────────
  # Scans the Rust and npm trees for known vulnerabilities. cargo audit is the
  # gate; npm audit is deliberately reporting-only (see the step comment).
  # Uses the repo default token at `contents: read` — audit reads the lockfile
  # and the advisory DB over the network, and writes nothing.
  audit:
    name: Dependency Audit (cargo/npm)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      # Prebuilt cargo-audit (fast; `cargo install` would compile ~150 deps).
      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026
        with:
          tool: cargo-audit@0.22.2
      # Two RUSTSEC advisories are deliberately --ignore'd: both are quick-xml
      # (unbounded namespace allocation + quadratic duplicate-attribute check),
      # reached only via iroh's netwatch -> netdev -> plist chain, and clearing
      # them needs an iroh bump (tracked as follow-up, not this change).
      # Everything else must stay clean — a newly-disclosed advisory fails the
      # build, which is the point of a gate.
      - name: cargo audit (gate)
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # npm audit is NON-gating today: every finding is in devDependencies (build
      # tooling — vite/vitest/electron-builder/postcss), and clearing them is a
      # lockfile-migration project, not a config line. This step surfaces the
      # count in every run so a regression is visible; flip it to a gate (drop
      # `set +e`) once the tree is clean.
      - name: npm audit (reporting — non-gating)
        run: |
          set +e
          for d in crates/veld-daemon/ui crates/veld-daemon/frontend desktop testproject-nextjs; do
            echo "=== $d ==="
            (cd "$d" && npm audit --audit-level=high)
          done
          echo "npm audit is non-gating; see the Dependency Audit job comment."

  go-test:
    permissions:
      contents: read
    name: Go Module Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'
      - name: Test caddy/inject module
        working-directory: caddy/inject
        run: go test -v ./...

  check:
    permissions:
      contents: read
    name: Check & Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            crates/veld-daemon/frontend/package-lock.json
            crates/veld-daemon/ui/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd crates/veld-daemon/frontend && npm ci
          cd ../ui && npm ci
      # zsh is what `the_generated_zshenv_wins_against_an_rc_that_rebuilds_path`
      # drives. That test asserts the mechanism the terminal-URL feature rests on, and
      # it *skips* when zsh is missing — so without this the runner image silently
      # decides whether the feature has any CI protection. The test also fails hard on
      # a skip when $CI is set, so a future image change cannot quietly re-open this.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  frontend:
    permissions:
      contents: read
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: crates/veld-daemon/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/veld-daemon/frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  ui:
    permissions:
      contents: read
    name: Management UI v2 (TypeScript)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: crates/veld-daemon/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: crates/veld-daemon/ui/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (single-file bundle)
        run: npm run build
      # The favicon reaches the served /ide only because Vite copies the tag
      # through untouched. The `schema` job checks the sources; this checks a
      # bundle built the same way as the one `crates/veld-daemon/build.rs`
      # embeds (same config and entry, its own `--outDir`), which is where a
      # Vite that stopped copying it through would show up. The script picks up
      # `dist/index.html` whenever it exists.
      # Spelled absolutely: this job's `defaults.run.working-directory` is the UI
      # package, and a bare `.` here reads as either that or the workspace root
      # depending on how you think overrides compose.
      - name: Favicon survives the bundle
        working-directory: ${{ github.workspace }}
        run: ./tests/validate-favicon.sh

  desktop:
    permissions:
      contents: read
    name: Desktop Shell (Electron)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      # The Chromium binary is irrelevant for a syntax/dependency check.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # Biome parses before it lints, so a syntax error is a lint failure — this
      # replaces the old `node --check` loop, which was syntax-only. Linting the
      # directories rather than a hand-maintained file list: the enum it
      # replaced went stale (`windows.js`/`windowState.js` were parsed by nothing
      # until added), and `correctness/noUndeclaredVariables` here catches the
      # bug class `node --check` could not see (the `PROMPT_TIMEOUT_MS` ReferenceError).
      - name: Lint
        run: npm run lint
      # The icons are generated and committed (see docs/branding.md). The generator
      # is stdlib-only and byte-deterministic, so re-running it is the drift gate:
      # without one, a hand-edited or stale asset ships silently — the same reason
      # THIRD-PARTY-LICENSES.md has a check.
      - name: Icons match the generator
        run: |
          python3 scripts/make-icons.py
          # `git status`, not `git diff`: a generator that grows an output writes an
          # *untracked* file, which a diff ignores by definition.
          if [ -n "$(git status --porcelain -- assets)" ]; then
            git status --porcelain -- assets
            echo "::error::desktop/assets is out of date — run 'just desktop-icons' and commit"
            exit 1
          fi
      # The shell's own trust boundary: what the page is allowed to hand the main
      # process (view ids, session slot names, URLs). Pure and Electron-free on
      # purpose, so it is testable without a Chromium binary.
      - name: Test
        run: npm test

  # Packaging is verified here rather than only at release time: the release
  # workflow builds the app *before* it tags, so a broken electron-builder config
  # blocks the CLI's release too, and the change that broke it merged green. That
  # is not hypothetical — the Linux leg of this job is what caught
  # `executableName` rejecting the scoped package name, which a macOS-only local
  # build could not have.
  #
  # It runs on every PR, including Rust-only ones: `ci.yml` has no path filters
  # anywhere and a partial gate here would be the first. The split is about what
  # each platform costs, not about how often it is needed:
  #
  #   Linux  — the full installers (AppImage + deb, two invocations), on a
  #            standard runner.
  #   macOS  — both arches, but `--dir`: it exercises everything up to and
  #            including the ad-hoc signing hook (the mac-specific risk) without
  #            spending ~8 minutes of a 10×-billed runner on dmg/zip
  #            compression.
  #
  # Residual gap, stated rather than implied: dmg/zip creation and the
  # `latest-mac.yml` the updater feeds on are produced only by the release build.
  # A change that breaks those (a dmg layout, a publish block) still fails at
  # release time and still blocks the tag.
  desktop-package:
    name: Desktop Packaging (${{ matrix.name }})
    needs: desktop
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # This job downloads and runs third-party build tooling (the Electron dist,
    # app-builder-bin), so it gets the token scope its release-workflow twin has
    # rather than the repo default.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            run: npm run package:linux
          - name: macos
            os: macos-latest
            run: npx electron-builder --mac --arm64 --x64 --dir --publish never
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      # No ELECTRON_SKIP_BINARY_DOWNLOAD here, unlike the job above: packaging
      # needs the real dist.
      - run: npm ci
      - name: Package
        run: ${{ matrix.run }}
      # The AppImage must not carry a `package-type` file: it is what
      # electron-updater dispatches on, and a `deb` there would send the one
      # self-updating Linux build down the dpkg path. The separate output
      # directories are what prevent it; this is the assertion that they did.
      - name: The AppImage was not packed with a package manager's marker
        if: matrix.name == 'linux'
        run: |
          if [ -e dist/linux-unpacked/resources/package-type ]; then
            echo "::error::dist/linux-unpacked/resources/package-type exists — the deb build leaked into the AppImage's staging dir"
            exit 1
          fi
      # The signature is the part that decides whether a downloaded build opens
      # at all on Apple Silicon, and it comes from our own afterPack hook rather
      # than from electron-builder — so assert it instead of trusting the log.
      # Both arches: electron-builder writes x64 to dist/mac and arm64 to
      # dist/mac-arm64, and the hook runs once per arch.
      - name: Verify the ad-hoc signature
        if: matrix.name == 'macos'
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Veld.app
          codesign --verify --deep --strict dist/mac/Veld.app
      # Same reason the release job checks it: a missing feed is invisible until
      # an installed app asks for an update. The macOS leg is `--dir`, which
      # produces no feed by design.
      # The listing comes first so a failed assertion still leaves the one piece
      # of output that says what *was* produced.
      - name: List artifacts
        run: ls -la dist
      - name: The update feed was written
        if: matrix.name == 'linux'
        run: test -f dist/latest-linux.yml

  integration:
    permissions:
      contents: read
    name: Integration Tests (macOS)
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            crates/veld-daemon/frontend/package-lock.json
            crates/veld-daemon/ui/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd crates/veld-daemon/frontend && npm ci
          cd ../ui && npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Build all binaries
        run: cargo build

      # Build Caddy with the veld_inject plugin from this branch.
      # install_caddy() just checks the binary exists — no markers needed.
      - name: Build Caddy with local veld_inject
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          XCADDY_VERSION=$(cat .xcaddy-version)
          go install "github.com/caddyserver/xcaddy/cmd/xcaddy@v${XCADDY_VERSION}"
          mkdir -p "$HOME/.local/lib/veld"
          xcaddy build \
            --with github.com/prosperity-solutions/veld/caddy/inject=./caddy/inject \
            --output "$HOME/.local/lib/veld/caddy"
          chmod +x "$HOME/.local/lib/veld/caddy"
          # Stash a copy so we can restore after cleanup steps.
          cp "$HOME/.local/lib/veld/caddy" /tmp/caddy-preserve

      - name: Verify CLI basics
        run: |
          ./target/debug/veld --version
          ./target/debug/veld --help

      - name: Test config parsing (testproject)
        working-directory: testproject
        run: |
          ../target/debug/veld nodes
          ../target/debug/veld nodes --json
          ../target/debug/veld graph frontend:local
          ../target/debug/veld config --files
          # The issue's whole point for `veld lint` is CI. A fixture config that
          # does not pass its own linter is not a fixture.
          ../target/debug/veld lint
          ../target/debug/veld lint --json

      - name: Lint every config in the repo
        run: |
          set -e
          # `veld lint` exits 1 on any error-severity finding, so this gates the
          # repo's own configs against every rule in `config::validate`.
          for cfg in $(git ls-files '*veld.json' '*veld.jsonc' | grep -v node_modules); do
            dir=$(dirname "$cfg")
            echo "--- $cfg"
            (cd "$dir" && "$GITHUB_WORKSPACE/target/debug/veld" lint)
          done

      - name: Doc examples load and lint clean
        run: |
          set -e
          # This job is the enforcement point: the gate needs a built veld, and this
          # is the job that has one. `validate-schema.sh` also invokes it when a
          # binary happens to be present locally, but skips otherwise — putting the
          # requirement there instead just failed the schema job, which never builds
          # Rust. A gate that skips itself reads as a pass, so it lives where it runs.
          python3 tests/validate-doc-examples.py target/debug/veld

      - name: Reject a v1/v2 config with the upgrade instructions
        run: |
          set -e
          work=$(mktemp -d)
          # veld reads only schemaVersion 3, and the rejection message *is* the
          # migration guide — there is no converter to fall back on, so a message
          # that regresses leaves an upgrading user with nothing.
          sed 's/"schemaVersion": "3"/"schemaVersion": "2"/' testproject/veld.json \
            > "$work/veld.json"
          cd "$work"
          out=$("$GITHUB_WORKSPACE/target/debug/veld" lint 2>&1) && {
            echo "a schemaVersion 2 config must not load"; exit 1
          }
          echo "$out"
          for needle in 'no longer supported' 'argv' 'shell' 'docs/migrating-to-v3.md' 'veld lint'; do
            echo "$out" | grep -q -- "$needle" || {
              echo "rejection message lost: $needle"; exit 1
            }
          done
          echo "v2 rejection message verified."

      - name: Verify setup subcommands exist
        run: |
          set -e
          ./target/debug/veld setup --help | grep -q "unprivileged"
          ./target/debug/veld setup --help | grep -q "privileged"
          ./target/debug/veld doctor --help | grep -q "json"
          echo "Setup subcommands and doctor verified."

      - name: Test Python servers directly
        run: |
          set -e
          python3 testproject/backend/server.py 19555 &
          PID_B=$!
          python3 testproject/frontend/server.py 19556 &
          PID_F=$!
          sleep 2
          curl -sf http://localhost:19555/health
          curl -sf http://localhost:19555/
          curl -sf http://localhost:19556/
          kill $PID_B $PID_F
          wait $PID_B $PID_F 2>/dev/null || true

      - name: Run full integration tests
        run: |
          chmod +x tests/integration.sh
          # `VELD_DB_PATH` because this runs the **cargo-built** binary under `sudo`, and
          # a cargo-built binary resolves its database through `Db::cargo_target_db` — the
          # worktree's own `.veld-dev/veld-cargo.db`. Run as root, that creates the file
          # root-owned, and every later step in this job runs as the runner: SQLite then
          # answers `unable to open database file` for the rest of the job. It cost a red
          # `Integration Tests (macOS)` on #279, and it is latent on `main` — the
          # unprivileged block that trips over it is skipped whenever Caddy fails to start,
          # which in CI is most of the time, so the bug only surfaces on the runs that get
          # far enough. Giving root its own database is the fix rather than chowning the
          # shared one afterwards: two users sharing one SQLite file is the problem.
          sudo env VELD_DB_PATH="${RUNNER_TEMP:-/tmp}/veld-ci-root.db" ./tests/integration.sh \
            --veld-bin "$(pwd)/target/debug/veld" \
            --project-dir "$(pwd)/testproject"

      - name: "Cleanup after integration tests"
        run: |
          sudo env VELD_DB_PATH="${RUNNER_TEMP:-/tmp}/veld-ci-root.db" "$(pwd)/target/debug/veld" uninstall 2>/dev/null || true
          curl -s -X POST http://localhost:2019/stop 2>/dev/null || true
          sudo rm -rf "$HOME/.veld" "$HOME/.local/lib/veld" /usr/local/lib/veld 2>/dev/null || true
          sudo chown -R "$(whoami)" "$HOME/.local" 2>/dev/null || true
          sudo launchctl bootout system/dev.veld.helper 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.helper" 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.daemon" 2>/dev/null || true
          sleep 2
          # Restore the Caddy binary for subsequent tests.
          mkdir -p "$HOME/.local/lib/veld"
          cp /tmp/caddy-preserve "$HOME/.local/lib/veld/caddy"
          chmod +x "$HOME/.local/lib/veld/caddy"

      - name: "Test: unprivileged setup lifecycle"
        run: |
          set -e
          VELD="$(pwd)/target/debug/veld"
          echo "=== Unprivileged setup ==="
          # Setup may fail on CA trust in CI (no keychain / Caddy timing) — allow partial success
          $VELD setup unprivileged || echo "WARNING: setup returned non-zero (CA trust may have failed in CI)"

          echo ""
          echo "=== Run doctor (diagnostics) ==="
          $VELD doctor || echo "WARNING: doctor reported issues (expected in CI — Caddy may not start)"
          $VELD doctor --json > /tmp/doctor-unpriv.json 2>/dev/null || true
          cat /tmp/doctor-unpriv.json

          echo ""
          echo "=== Verify setup.json ==="
          cat ~/.veld/setup.json
          grep -q '"unprivileged"' ~/.veld/setup.json

          echo ""
          echo "=== Verify helper is running on user socket ==="
          test -S ~/.veld/helper.sock
          echo "Helper socket OK"

          echo ""
          echo "=== Check if Caddy is running ==="
          CADDY_OK=0
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:2019/id/veld-sentinel 2>/dev/null | grep -q "veld"; then
              CADDY_OK=1
              break
            fi
            sleep 2
          done

          if [ "$CADDY_OK" = "1" ]; then
            echo "Caddy is running (sentinel verified)"
            curl -sf http://localhost:2019/config/apps/http/servers/veld/listen | grep -q "18443"
            echo "Caddy listening on port 18443"

            echo ""
            echo "=== Start a service in unprivileged mode ==="
            cd testproject
            $VELD start frontend:local --name unpriv-test
            sleep 2

            echo ""
            echo "=== Verify URLs have :18443 ==="
            $VELD urls --name unpriv-test --json | grep -q "18443"

            echo ""
            echo "=== Stop ==="
            $VELD stop --name unpriv-test
            cd ..
          else
            echo "WARNING: Caddy did not start in CI (timing issue), skipping HTTPS tests"
          fi

          echo ""
          echo "=== Uninstall (unprivileged) ==="
          $VELD uninstall || echo "WARNING: uninstall returned non-zero"

          echo ""
          echo "=== Verify cleanup ==="
          sleep 2
          if ! curl -sf http://localhost:2019/config/ >/dev/null 2>&1; then
            echo "Caddy stopped OK"
          else
            echo "WARNING: Caddy still running (may need manual cleanup)"
          fi

          if [ ! -f ~/.veld/setup.json ]; then
            echo "setup.json removed OK"
          else
            echo "WARNING: setup.json still exists"
          fi

          echo ""
          echo "=== Unprivileged lifecycle PASSED ==="

      - name: "Cleanup between lifecycle tests (unpriv → priv)"
        if: always()
        run: |
          curl -s -X POST http://localhost:2019/stop 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.helper" 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.daemon" 2>/dev/null || true
          rm -rf "$HOME/.veld" 2>/dev/null || true
          rm -f "$HOME/.local/lib/veld/caddy-data" 2>/dev/null || true
          # Privileged setup runs as root. sudo on macOS may resolve
          # lib_dir() to /usr/local/lib/veld. Ensure Caddy is there too.
          sudo mkdir -p /usr/local/lib/veld
          sudo cp /tmp/caddy-preserve /usr/local/lib/veld/caddy
          sudo chmod +x /usr/local/lib/veld/caddy
          sleep 1

      - name: "Test: privileged setup lifecycle"
        run: |
          set -e
          VELD="$(pwd)/target/debug/veld"
          echo "=== Privileged setup ==="
          # Root gets its own database — see the integration step above.
          sudo env VELD_DB_PATH="${RUNNER_TEMP:-/tmp}/veld-ci-root.db" $VELD setup privileged
          echo ""

          echo "=== Run doctor (diagnostics) ==="
          $VELD doctor || echo "WARNING: doctor reported issues (expected in CI)"
          $VELD doctor --json > /tmp/doctor-priv.json 2>/dev/null || true
          cat /tmp/doctor-priv.json

          echo ""
          echo "=== Verify setup.json ==="
          cat ~/.veld/setup.json
          grep -q '"privileged"' ~/.veld/setup.json

          echo ""
          echo "=== Verify helper is running on system socket ==="
          test -S /var/run/veld-helper.sock
          echo "System socket OK"

          echo ""
          echo "=== Check Caddy ==="
          CADDY_OK=0
          for i in 1 2 3 4 5; do
            if curl -sf http://localhost:2019/id/veld-sentinel 2>/dev/null | grep -q "veld"; then
              CADDY_OK=1
              break
            fi
            sleep 2
          done

          echo ""
          echo "=== Re-run setup while helper is running (bootout/bootstrap race) ==="
          # Regression test: re-running privileged setup used to race launchctl
          # bootout against bootstrap, silently losing the launchd job and
          # leaving an unmanaged orphan helper that died on the next update.
          # Stage Caddy in the user lib dir too: later steps (veld start) can
          # create ~/.local/lib/veld and flip lib_dir() resolution, so keep the
          # binary present in both candidate paths.
          mkdir -p "$HOME/.local/lib/veld"
          cp /tmp/caddy-preserve "$HOME/.local/lib/veld/caddy" 2>/dev/null || true
          chmod +x "$HOME/.local/lib/veld/caddy" 2>/dev/null || true
          # Root gets its own database — see the integration step above.
          sudo env VELD_DB_PATH="${RUNNER_TEMP:-/tmp}/veld-ci-root.db" $VELD setup privileged
          sleep 2
          if sudo launchctl print system/dev.veld.helper | grep -qE '^[[:space:]]*pid = [1-9]'; then
            echo "Helper job still registered and running after re-setup"
          else
            echo "FAIL: helper launchd job lost after re-running setup"
            exit 1
          fi
          $VELD doctor --json > /tmp/doctor-resetup.json 2>/dev/null || true
          if grep -q "NOT managed" /tmp/doctor-resetup.json; then
            echo "FAIL: doctor reports unmanaged helper after re-setup"
            cat /tmp/doctor-resetup.json
            exit 1
          fi
          echo "Re-setup race check PASSED"

          if [ "$CADDY_OK" = "1" ]; then
            echo "Caddy running (sentinel verified)"
            curl -sf http://localhost:2019/config/apps/http/servers/veld/listen | grep -q '":443"'
            echo "Caddy on port 443"

            echo ""
            echo "=== Start a service in privileged mode ==="
            cd testproject
            if $VELD start frontend:local --name priv-test 2>&1; then
              sleep 2
              URLS=$($VELD urls --name priv-test --json 2>/dev/null || true)
              if echo "$URLS" | grep -q "18443"; then
                echo "FAIL: URLs contain :18443 in privileged mode"
                exit 1
              fi
              echo "Clean URLs OK"
              $VELD stop --name priv-test 2>/dev/null || true
            else
              echo "WARNING: veld start failed in CI (non-fatal)"
            fi
            cd ..
          else
            echo "WARNING: Caddy did not start, skipping service tests"
          fi

          echo ""
          echo "=== Uninstall (privileged) ==="
          sudo $VELD uninstall || echo "WARNING: uninstall returned non-zero"

          echo ""
          echo "=== Verify cleanup ==="
          sleep 2
          if ! curl -sf http://localhost:2019/config/ >/dev/null 2>&1; then
            echo "Caddy stopped OK"
          else
            echo "WARNING: Caddy still running"
          fi
          echo "=== Privileged lifecycle PASSED ==="

      - name: "Cleanup between lifecycle tests (priv → auto)"
        if: always()
        run: |
          sudo curl -s -X POST http://localhost:2019/stop 2>/dev/null || true
          sudo launchctl bootout system/dev.veld.helper 2>/dev/null || true
          sudo rm -rf "$HOME/.veld" "$HOME/.local/lib/veld" /usr/local/lib/veld 2>/dev/null || true
          sudo chown -R "$(whoami)" "$HOME/.local" 2>/dev/null || true
          sleep 1
          # Restore the Caddy binary for subsequent tests.
          mkdir -p "$HOME/.local/lib/veld"
          cp /tmp/caddy-preserve "$HOME/.local/lib/veld/caddy"
          chmod +x "$HOME/.local/lib/veld/caddy"

      - name: "Test: auto-bootstrap (no setup)"
        run: |
          set -e
          VELD="$(pwd)/target/debug/veld"
          echo "=== Auto-bootstrap: start without any setup ==="
          cd testproject
          # Auto-bootstrap may fail in CI due to Caddy startup issues — allow soft failure
          if $VELD start frontend:local --name auto-test 2>&1; then
            sleep 2

            echo ""
            echo "=== Verify it auto-bootstrapped ==="
            cat ~/.veld/setup.json
            grep -q '"auto"' ~/.veld/setup.json

            echo ""
            echo "=== Verify URLs have :18443 ==="
            $VELD urls --name auto-test --json | grep -q "18443"

            echo ""
            echo "=== Stop ==="
            $VELD stop --name auto-test
          else
            echo "WARNING: auto-bootstrap veld start failed in CI (Caddy may not start in this environment)"
            # Still verify the setup.json was written
            if [ -f ~/.veld/setup.json ]; then
              grep -q '"auto"' ~/.veld/setup.json && echo "setup.json mode=auto OK"
            fi
          fi
          cd ..

          echo ""
          echo "=== Cleanup auto-bootstrap state ==="
          curl -s http://localhost:2019/stop >/dev/null 2>&1 || true
          rm -rf "$HOME/.veld"
          sleep 1
          echo "=== Auto-bootstrap PASSED ==="

  # ── Release build matrix — catch build failures before merge ──────
  release-build:
    permissions:
      contents: read
    name: Release Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            goos: darwin
            goarch: arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: macos-amd64
            goos: darwin
            goarch: amd64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
            goos: linux
            goarch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
            cross: true
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            crates/veld-daemon/frontend/package-lock.json
            crates/veld-daemon/ui/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd crates/veld-daemon/frontend && npm ci
          cd ../ui && npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build Caddy with veld_inject
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          XCADDY_VERSION=$(cat .xcaddy-version)
          go install "github.com/caddyserver/xcaddy/cmd/xcaddy@v${XCADDY_VERSION}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} xcaddy build \
            --with github.com/prosperity-solutions/veld/caddy/inject=./caddy/inject \
            --output ./caddy-build-test
          rm -f ./caddy-build-test

  injection-test:
    permissions:
      contents: read
    name: Injection E2E (macOS)
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            crates/veld-daemon/frontend/package-lock.json
            crates/veld-daemon/ui/package-lock.json
      - name: Install frontend dependencies
        run: |
          cd crates/veld-daemon/frontend && npm ci
          cd ../ui && npm ci
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24'

      - name: Build veld
        run: cargo build

      - name: Install Next.js deps
        working-directory: testproject-nextjs
        run: npm install

      - name: Build Caddy with local veld_inject
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          XCADDY_VERSION=$(cat .xcaddy-version)
          go install "github.com/caddyserver/xcaddy/cmd/xcaddy@v${XCADDY_VERSION}"
          mkdir -p "$HOME/.local/lib/veld"
          xcaddy build \
            --with github.com/prosperity-solutions/veld/caddy/inject=./caddy/inject \
            --output "$HOME/.local/lib/veld/caddy"
          chmod +x "$HOME/.local/lib/veld/caddy"

      - name: Setup veld (unprivileged)
        run: |
          ./target/debug/veld setup unprivileged || echo "WARNING: setup returned non-zero (CA trust may have failed)"

      - name: Wait for Caddy
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:2019/id/veld-sentinel 2>/dev/null | grep -q "veld"; then
              echo "Caddy is running"
              break
            fi
            sleep 2
          done

      - name: Run injection E2E tests
        run: |
          chmod +x tests/test-injection.sh
          ./tests/test-injection.sh \
            --veld-bin "$(pwd)/target/debug/veld" \
            --project-dir "$(pwd)/testproject-nextjs"

      - name: Cleanup
        if: always()
        run: |
          ./target/debug/veld uninstall 2>/dev/null || true
          curl -s -X POST http://localhost:2019/stop 2>/dev/null || true
          rm -rf "$HOME/.veld" "$HOME/.local/lib/veld" 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.helper" 2>/dev/null || true
          launchctl bootout "gui/$(id -u)/dev.veld.daemon" 2>/dev/null || true


  # ── Helper signing smoke test (issue #339) ────────────────────────
  #
  # `release.yml`'s `Package client binaries` step is the only place `veld-sign`
  # and the macOS ad-hoc-then-ed25519 ordering ever run — and it runs only on a
  # tagged release, so the first execution of a change to that path used to be
  # the release itself. v16.58.1 failed there because the `SIGNING_PRIVATE_KEY`
  # secret held a PEM of the wrong kind, and nothing before the release could
  # have said so. `release-build` above compiles the workspace; it never
  # packages, which is the same gap that hid the `veld-sign` cross-compile bug
  # found in #253's review.
  #
  # Linux coverage is already free: `check` runs `cargo test --workspace` on
  # ubuntu, which includes `crates/veld-sign/tests/smoke.rs`. This job exists
  # for the macOS half — `codesign` is what install.sh's re-sign idempotency
  # rests on, and nothing else in CI can exercise it.
  #
  # The test generates a throwaway ed25519 key per run from /dev/urandom and
  # hands it over as `VELD_SIGN_SMOKE_KEY`. `SIGNING_PRIVATE_KEY` is never
  # referenced here, so the org key stays out of PR-triggered jobs entirely.
  #
  # What this still does NOT cover, so nobody reads the job name as more than it
  # is. Both are in `Package client binaries` and both first run at a release:
  #
  #   * The `macos-amd64` leg ad-hoc signs a **cross-compiled** `x86_64-apple-darwin`
  #     binary on an arm64 runner. The idempotency test signs a host-native
  #     Mach-O, so the cross-arch case is unexercised.
  #   * Nothing asserts `veld-helper.sig` actually lands in the tarball that
  #     `tar -czf ... -C dist .` produces.
  signing-smoke:
    permissions:
      contents: read
    name: Helper Signing Smoke (macOS)
    runs-on: macos-latest
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Sign a dummy binary end to end
        run: cargo test -p veld-sign
