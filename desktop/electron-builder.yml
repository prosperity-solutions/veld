# Packaging config for Veld Desktop (see desktop/ARCHITECTURE.md → "Packaging").
#
# macOS and Linux only. There is deliberately no Windows target: the whole UI is
# served by the daemon and a plain browser covers that platform, so a Windows
# build would be an installer around a page you can already open.
#
# The version comes from package.json, which release CI rewrites to the tag being
# built — the app and the CLI ship one version from one tag (see
# `.releaserc.json` and `.github/workflows/release.yml`).
appId: dev.veld.desktop
productName: Veld
copyright: Copyright © Prosperity Solutions

# `buildResources` is deliberately left at its default (`build/`, which holds only
# the release signature's entitlements): electron-builder excludes that directory
# from the packaged app, and `assets/` has to ship — the tray icon is read from it
# at runtime. The icons are referenced by explicit path below instead.
directories:
  output: dist

# An allow-list, not an ignore-list: the shell is a handful of source files plus
# the generated icons, and anything else in here (scripts/, tests, dist/) has no
# business inside the bundle. Production `dependencies` are added implicitly.
files:
  - src/**/*.js
  - src/remoteChooser.html
  - "!src/**/*.test.js"
  - assets/**
  - package.json

# `latest-mac.yml` / `latest-linux.yml` are the update feed electron-updater
# reads, and they are only written when a publish provider is configured — so
# this block exists even though CI always packages with `--publish never` and
# attaches the artifacts through the release workflow's own `publish` job,
# alongside the CLI tarballs. It is also what gets baked into the bundle as
# `app-update.yml`, which is how the installed app knows where to look.
publish:
  provider: github
  owner: prosperity-solutions
  repo: veld

mac:
  category: public.app-category.developer-tools
  # 1024×1024 PNG generated by `scripts/make-icons.py`; electron-builder derives
  # the .icns from it, so there is no second committed asset to drift.
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what Squirrel.Mac updates *from* — a dmg is a disk image, not an
    # update payload — so `latest-mac.yml` points at it. Shipped now even though
    # macOS self-install is off (see below), because the alternative is a release
    # whose update feed describes files that aren't there.
    - target: zip
      arch: [arm64, x64]
  # `null` here, and the real identity on the command line in release CI only
  # (`-c.mac.identity=<team id>`, see `.github/workflows/release.yml` → desktop).
  # So a local or pull-request build never signs for real, whatever certificates
  # sit in the keychain of the machine that built it — artifacts must not depend
  # on that — and `scripts/adhoc-sign.js` ad-hoc signs it instead, which is not a
  # trust signal but *is* what makes it launch at all on Apple Silicon. The team id
  # as the qualifier picks this team's Developer ID certificate and no other.
  identity: null
  # Only take effect when the identity above is overridden. Notarization requires
  # the hardened runtime; the entitlements are what let Electron run under it
  # (reasons in the plist).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
# The disk image is signed and notarized by release CI after the build, with a
# secure timestamp electron-builder's own dmg signing does not add — so it must
# not sign it here, and must not write a blockmap for it: signing changes the
# bytes the blockmap would describe. The update feed points at the zips, which
# keep theirs.
dmg:
  sign: false
  writeUpdateInfo: false
linux:
  category: Development
  icon: assets/icon.png
  maintainer: Prosperity Solutions <veld@life.li>
  synopsis: Local development environment orchestrator
  # Required: without it electron-builder derives the executable name from
  # package.json's `@veld/desktop`, and its own path validation then rejects the
  # `@` — every Linux build fails. The scoped package name is not going away
  # (it is what makes this npm project unpublishable by accident), so the
  # executable is named here.
  executableName: veld-desktop
  # AppImage ONLY. The .deb is built by a second, separate invocation
  # (`npm run package:linux`) into its own output directory — and then moved
  # into `dist/`, leaving that directory's own `latest-linux.yml` behind, since
  # publishing a feed describing the .deb would point the AppImage's updater at
  # a package it cannot install. The separation itself is load-bearing rather
  # than tidiness: `FpmTarget` writes a `package-type`
  # file naming its format into `<out>/linux-unpacked/resources` — the same
  # directory the AppImage packs from — and the two targets run concurrently.
  # If the deb's write wins the race, the AppImage ships `package-type: deb`,
  # electron-updater instantiates `DebUpdater` instead of `AppImageUpdater`
  # (`electron-updater/out/main.js:52`), and "Download and Install" fetches a
  # .deb and runs `dpkg -i` while the running AppImage is never replaced.
  # Building into separate directories is what makes that unreachable.
  target:
    - target: AppImage
      arch: [x64]

# `veld-desktop-`, not `Veld-`: every asset on a release lands in one flat list
# beside the CLI's `veld-<version>-<os>-<arch>.tar.gz` tarballs, and a
# capitalised `Veld-` sorted itself away from them while still reading as "the
# veld download" — the app and the CLI were told apart by file extension alone.
# The prefix says which of the two you are looking at; it matches
# `linux.executableName` and the `veld-desktop-*` upload-artifact names in
# `release.yml`.
#
# Each target expands `${arch}` its own way — `arm64`/`x64` for macOS,
# `x86_64` for the AppImage, `amd64` for the .deb — so these names do not all
# match the release tarballs' `macos-amd64` spelling. Left alone deliberately:
# the name that has to agree is the one in the update feed electron-builder
# writes beside the file, and that is generated from this same pattern.
artifactName: veld-desktop-${version}-${os}-${arch}.${ext}

afterPack: scripts/adhoc-sign.js
