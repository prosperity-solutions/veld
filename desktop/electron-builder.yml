# Packaging config for Veld Desktop (see desktop/ARCHITECTURE.md → "Packaging").
#
# macOS and Linux only. There is deliberately no Windows target: the whole UI is
# served by the daemon and a plain browser covers that platform, so a Windows
# build would be an installer around a page you can already open.
#
# The version comes from package.json, which release CI rewrites to the tag being
# built — the app and the CLI ship one version from one tag (see
# `.releaserc.json` and `.github/workflows/release.yml`).
appId: dev.veld.desktop
productName: Veld
copyright: Copyright © Prosperity Solutions

# `buildResources` is deliberately left at its default (`build/`): electron-builder
# excludes that directory from the packaged app, which is exactly right for the two
# entitlements plists that live there — and it is why `assets/`, which *has* to ship
# (the tray icon is read from it at runtime), is not in it. The icons are referenced
# by explicit path below; the entitlements deliberately are not, and are picked up
# from `build/` by name instead — see the `mac` block for why a spelled-out path
# would be the fragile choice there.
directories:
  output: dist

# An allow-list, not an ignore-list: the shell is a handful of source files plus
# the generated icons, and anything else in here (scripts/, tests, dist/) has no
# business inside the bundle. Production `dependencies` are added implicitly.
files:
  - src/**/*.js
  - "!src/**/*.test.js"
  - assets/**
  - package.json

# `latest-mac.yml` / `latest-linux.yml` are the update feed electron-updater
# reads, and they are only written when a publish provider is configured — so
# this block exists even though CI always packages with `--publish never` and
# attaches the artifacts through the release workflow's own `publish` job,
# alongside the CLI tarballs. It is also what gets baked into the bundle as
# `app-update.yml`, which is how the installed app knows where to look.
publish:
  provider: github
  owner: prosperity-solutions
  repo: veld

mac:
  category: public.app-category.developer-tools
  # 1024×1024 PNG generated by `scripts/make-icons.py`; electron-builder derives
  # the .icns from it, so there is no second committed asset to drift.
  icon: assets/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what Squirrel.Mac updates *from* — a dmg is a disk image, not an
    # update payload — so `latest-mac.yml` points at it, and now that a release is
    # signed it is the file macOS self-updates actually download (the app decides
    # that by inspecting its own signature: `updatePolicy.js` → `isDeveloperIdSigned`,
    # called from `updater.js`).
    - target: zip
      arch: [arm64, x64]
  # ── Developer ID signing + notarization (issue #167 §10) ──────────
  #
  # `identity` is a *substring qualifier* matched against `security find-identity
  # -v` output, not a full certificate name (app-builder-lib's `_findIdentity`),
  # so this selects the team's Developer ID Application certificate without
  # hardcoding the company's legal name here or spending a repository secret on
  # it. Release CI supplies the certificate itself as `CSC_LINK` /
  # `CSC_KEY_PASSWORD`, which electron-builder imports into a throwaway keychain —
  # so a release still does not depend on what happens to be in the runner's
  # keychain, which is the property the previous `identity: null` was protecting.
  #
  # Where there is no Developer ID — a contributor's laptop, and *every* PR build,
  # since electron-builder refuses to sign at all when `GITHUB_BASE_REF` is set —
  # signing is skipped with a warning and `scripts/adhoc-sign.js` ad-hoc signs
  # instead. That is not a trust signal but is what makes the bundle launch at all
  # on Apple Silicon; see the hook for why it cannot simply be deleted.
  identity: Developer ID Application
  # Required by notarization, and the reason `build/entitlements.mac.plist` and
  # `build/entitlements.mac.inherit.plist` exist: under the hardened runtime Electron
  # cannot JIT or load its own frameworks without those exceptions, so a hardened
  # build with no entitlements is signed, notarized, and then crashes on launch.
  #
  # There is deliberately no `entitlements:` key naming them. electron-builder picks
  # both up from `buildResources` by name, anchored at the project directory — while
  # a spelled-out relative path is passed to `codesign` verbatim, resolved against
  # whatever the *process* working directory happens to be. Every caller today runs
  # from `desktop/`, so a path would work by coincidence and break the first time
  # anything invokes electron-builder from the repo root.
  hardenedRuntime: true
  # `spctl --assess` on the machine that just built the app answers a question
  # about *that machine's* policy state; the release workflow verifies the
  # signing identity and the notarization ticket on the artifact instead.
  gatekeeperAssess: false
  # Notarization is driven by the environment rather than by a key here:
  # electron-builder notarizes and staples the .app after signing it whenever it finds
  # credentials in the environment (`MacTargetHelper.getNotarizeOptions`), and **skips
  # it with a warning** when it does not. A warning is not a gate, which is why
  # release CI asserts the staple on the built app instead of trusting the log. The
  # only thing a `notarize:` key could do here is turn it off.
  #
  # It accepts either an App Store Connect API key (`APPLE_API_KEY` — a *path* — plus
  # `APPLE_API_KEY_ID` and `APPLE_API_ISSUER`) or an Apple ID (`APPLE_ID` +
  # `APPLE_APP_SPECIFIC_PASSWORD` + `APPLE_TEAM_ID`), and it checks `APPLE_ID`
  # **first** and throws if that route is half-populated. So the two sets are mutually
  # exclusive in practice, and `.github/workflows/release.yml`'s credentials step is
  # what picks one; do not add a stray `APPLE_ID` to a job using the API key.
# The disk image needs a notarization ticket of its own. Gatekeeper assesses the
# *downloaded* file when it is opened, and the ticket electron-builder staples to
# the .app is inside the .app — mounting an unnotarized image shows the same
# "Apple could not verify" dialog this whole change exists to remove, however well
# signed the app inside it is. So the dmg is signed here and notarized + stapled by
# the release workflow, in a second round trip after packaging.
#
# `writeUpdateInfo: false` is what makes that safe: electron-builder hashes each
# artifact as it finishes, so a dmg entry in `latest-mac.yml` (and its blockmap)
# would describe the bytes *before* stapling and be wrong the moment the ticket
# lands. Nothing loses information — electron-updater's macOS path takes the zip
# and excludes dmg/pkg outright (`findFile(files, "zip", ["pkg", "dmg"])`), so the
# feed never described a file it could use. The dmg stays a plain download.
dmg:
  sign: true
  writeUpdateInfo: false

linux:
  category: Development
  icon: assets/icon.png
  maintainer: Prosperity Solutions <veld@life.li>
  synopsis: Local development environment orchestrator
  # Required: without it electron-builder derives the executable name from
  # package.json's `@veld/desktop`, and its own path validation then rejects the
  # `@` — every Linux build fails. The scoped package name is not going away
  # (it is what makes this npm project unpublishable by accident), so the
  # executable is named here.
  executableName: veld-desktop
  # AppImage ONLY. The .deb is built by a second, separate invocation
  # (`npm run package:linux`) into its own output directory — and then moved
  # into `dist/`, leaving that directory's own `latest-linux.yml` behind, since
  # publishing a feed describing the .deb would point the AppImage's updater at
  # a package it cannot install. The separation itself is load-bearing rather
  # than tidiness: `FpmTarget` writes a `package-type`
  # file naming its format into `<out>/linux-unpacked/resources` — the same
  # directory the AppImage packs from — and the two targets run concurrently.
  # If the deb's write wins the race, the AppImage ships `package-type: deb`,
  # electron-updater instantiates `DebUpdater` instead of `AppImageUpdater`
  # (`electron-updater/out/main.js:52`), and "Download and Install" fetches a
  # .deb and runs `dpkg -i` while the running AppImage is never replaced.
  # Building into separate directories is what makes that unreachable.
  target:
    - target: AppImage
      arch: [x64]

# Each target expands `${arch}` its own way — `arm64`/`x64` for macOS,
# `x86_64` for the AppImage, `amd64` for the .deb — so these names do not all
# match the release tarballs' `macos-amd64` spelling. Left alone deliberately:
# the name that has to agree is the one in the update feed electron-builder
# writes beside the file, and that is generated from this same pattern.
artifactName: Veld-${version}-${os}-${arch}.${ext}

afterPack: scripts/adhoc-sign.js
