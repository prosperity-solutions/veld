[workspace]
members = [
    "crates/veld-core",
    "crates/veld",
    "crates/veld-helper",
    "crates/veld-daemon",
    "crates/veld-share",
    "crates/veld-stats",
    "crates/veld-gateway",
]
resolver = "2"

[workspace.package]
version = "16.15.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
# Distributed as prebuilt binaries, not crates.io packages. Marking the
# workspace unpublished also keeps our own crates out of the cargo-about
# THIRD-PARTY-LICENSES.md (see about.toml `private.ignore`).
publish = false

[workspace.dependencies]
veld-core = { path = "crates/veld-core" }
veld-share = { path = "crates/veld-share" }
veld-stats = { path = "crates/veld-stats" }
iroh = "1"
iroh-tickets = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
slug = "0.1"
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }
# `user` is for `getuid`: `desktop_app_pids` scopes its `ps` scan to the calling
# user, so another account's copy of Veld Desktop cannot be mistaken for this
# one's (and signalled, fruitlessly, with EPERM).
nix = { version = "0.29", features = ["signal", "process", "net", "fs", "user"] }
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
sha2 = "0.10"
base64 = "0.22"
petname = "2"
indicatif = "0.17"
indexmap = { version = "2", features = ["serde"] }
